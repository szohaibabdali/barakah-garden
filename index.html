    var list = entries.length ? '<div class="activity-list">'+ entries.map(function(h){
      var icon = h.kind==='savings' ? '\uD83D\uDCB0' : h.kind==='convert' ? '\uD83D\uDD04' : h.kind==='redeem_cash' ? '\uD83C\uDF81' : '\uD83E\uDD32';
      var neg = h.kind==='redeem_cash';
      return '<div class="activity-row"><div class="activity-icon">'+icon+'</div>'+
        '<div class="activity-body"><div class="activity-label">'+escapeHtml(h.label||(h.kind==='savings'?'Savings added':'Charity given'))+'</div>'+
        '<div class="activity-meta">'+timeAgo(h.ts)+'</div></div>'+
        '<div class="activity-pts '+(neg?'neg':'pos')+'">'+(neg?'-':'+')+cur+' '+fmtMoney(h.amount)+'</div></div>';
    }).join('') + '</div>' : '<div class="empty-state"><span class="em">\uD83D\uDCB0</span>No money logged yet.</div>';

      ? '<button class="btn-secondary" style="width:100%;margin-bottom:6px;" data-action="open-convert" data-person="'+p.id+'">\uD83D\uDD04 Ask to convert points to money ('+ptsLabel(state.data.pointsPerCurrency)+' = '+cur+' 1)</button>'+
        convertRequestNote(p)+'<div style="height:8px;"></div>'
      : '';
    // Kids can't add money themselves (money buys rewards) \u2014 parents add it
    // from Parent Mode > Adjust. Parents can still log their own here.
    var addBtns = isKid
      ? '<div class="note-box" style="margin-top:14px;">Got money for Eid, a gift or charity? Ask a parent to add it in Parent Mode \u2192 Adjust.</div>'
      : '<div class="seg-row" style="margin-top:14px;">'+
          '<button class="btn-secondary" style="flex:1;" data-action="open-money-form" data-person="'+p.id+'" data-kind="savings">+ Add Savings</button>'+
          '<button class="btn-secondary" style="flex:1;" data-action="open-money-form" data-person="'+p.id+'" data-kind="charity_money">+ Add Charity</button>'+
        '</div>';
    return convertBtn + '<div class="money-card">'+
        '<div class="money-stat"><span class="money-label">'+(isKid?'Money':'Savings')+'</span><span class="money-val disp">'+cur+' '+fmtMoney(p.savings)+'</span></div>'+
        '<div class="money-stat"><span class="money-label">Charity Given</span><span class="money-val disp" style="color:var(--berry);">'+cur+' '+fmtMoney(p.charityGiven)+'</span></div>'+
      '</div>'+
      addBtns+
      '<p class="section-title">History</p>' + list;
  }

  function renderActivityTab(p){
    var items = state.data.history.filter(function(h){ return h.personId === p.id; });
    if(items.length===0){
      return '<div class="empty-state"><span class="em">\uD83C\uDF31</span>No activity yet \u2014 it will show up here!</div>';
    }
    var cur = state.data.currency;
    return '<div class="activity-list">'+ items.map(function(h){
      var icon, main, cls;
      if(h.kind==='redeem'){ icon=(REWARD_CATS[h.category]||REWARD_CATS.custom).icon; main='-'+h.points; cls='neg'; }
      else if(h.kind==='redeem_cash'){ icon=(REWARD_CATS[h.category]||REWARD_CATS.custom).icon; main='-'+cur+' '+fmtMoney(h.amount); cls='neg'; }
      else if(h.kind==='convert'){ icon='🔄'; main='-'+h.points+' → +'+cur+' '+fmtMoney(h.amount); cls='pos'; }
      else if(h.kind==='savings' || h.kind==='charity_money'){ icon = h.kind==='savings' ? '\uD83D\uDCB0' : '\uD83E\uDD32'; main='+'+cur+' '+fmtMoney(h.amount); cls='pos'; }
      else{
        var meta = SECTION_META[h.category] || SECTION_META.bonus;
        icon = meta.icon;
        if(!h.points){ main = '\u2713'; cls = 'pos'; }
        else{ var neg = h.points < 0; main = (neg?'':'+') + h.points; cls = neg ? 'neg' : 'pos'; }
      }
      return '<div class="activity-row"><div class="activity-icon">'+icon+'</div>'+
        '<div class="activity-body"><div class="activity-label">'+escapeHtml(h.label)+'</div>'+
        '<div class="activity-meta">'+timeAgo(h.ts)+'</div></div>'+
        '<div class="activity-pts '+cls+'">'+main+'</div></div>';
    }).join('') + '</div>';
  }

  /* ============ parent dashboard ============ */
  function countAllPending(){
    var n = 0;
    state.data.people.forEach(function(p){
      n += Object.keys(todayLogFor(p).pending||{}).length;
      n += (p.convertRequests||[]).length;
      n += (p.quranRequests||[]).length;
      n += (p.passRequests||[]).length;
    });
    n += state.data.owed.length;
    return n;
  }
  function renderParent(){
    var tab = state.route.tab || 'approvals';
    var content = tab==='approvals' ? renderParentApprovals()
      : tab==='members' ? renderParentMembers()
      : tab==='items' ? renderParentItems()
      : tab==='rewards' ? renderParentRewards()
      : tab==='adjust' ? renderParentAdjust()
      : renderParentSettings();
    var pendingCount = countAllPending();
    return '<div class="screen parent-screen">'+
      '<div class="parent-topbar"><h2 class="disp">\uD83D\uDCD3 Parent Mode</h2><button class="btn-ghost" data-action="exit-parent">Exit</button></div>'+
      '<div class="parent-tabs">'+
        '<button class="ptab '+(tab==='approvals'?'active':'')+'" data-action="parent-tab" data-tab="approvals">Approvals'+(pendingCount?' ('+pendingCount+')':'')+'</button>'+
        '<button class="ptab '+(tab==='members'?'active':'')+'" data-action="parent-tab" data-tab="members">Members</button>'+
        '<button class="ptab '+(tab==='items'?'active':'')+'" data-action="parent-tab" data-tab="items">Daily Items</button>'+
        '<button class="ptab '+(tab==='rewards'?'active':'')+'" data-action="parent-tab" data-tab="rewards">Rewards</button>'+
        '<button class="ptab '+(tab==='adjust'?'active':'')+'" data-action="parent-tab" data-tab="adjust">Adjust</button>'+

      '</div>'+ content + '</div>';

  function renderParentApprovals(){
    var rows = [];
    state.data.people.forEach(function(p){
      var log = todayLogFor(p);
      Object.keys(log.pending||{}).forEach(function(itemId){
        var item = getItem(itemId);
        if(!item) return;
        rows.push({p:p, item:item});
      });
    });
    var cur = state.data.currency;
    var extra = '';

    // points -> money requests
    var convRows = [];
    state.data.people.forEach(function(p){ (p.convertRequests||[]).forEach(function(rq){ convRows.push({p:p, rq:rq}); }); });
    if(convRows.length){
      extra += '<div class="card"><p class="field-label">\ud83d\udd04 Points \u2192 money requests</p>'+ convRows.map(function(c){
        return '<div class="list-row"><div style="font-size:19px;">'+c.p.avatar+'</div>'+
          '<div class="grow"><div class="name">'+escapeHtml(c.p.name)+'</div>'+
          '<div class="sub">'+c.rq.pts+' pts \u2192 '+cur+' '+fmtMoney(pointsToCash(c.rq.pts))+' \u00b7 '+timeAgo(c.rq.ts)+'</div></div>'+
          '<button class="icon-btn" style="color:var(--moss);" data-action="approve-convert" data-person="'+c.p.id+'" data-req="'+c.rq.id+'">\u2713</button>'+
          '<button class="icon-btn" style="color:var(--coral);" data-action="decline-convert" data-person="'+c.p.id+'" data-req="'+c.rq.id+'">\u2715</button></div>';
      }).join('') + '</div>';
    }

    extra += renderPassApprovals();
    // Quran reading
    var qRows = [];
    state.data.people.forEach(function(p){ (p.quranRequests||[]).forEach(function(rq){ qRows.push({p:p, rq:rq}); }); });
    if(qRows.length){
      extra += '<div class="card"><p class="field-label">\uD83D\uDCD6 Quran reading</p>'+ qRows.map(function(c){
        return '<div class="list-row"><div style="font-size:19px;">\uD83D\uDCD6</div>'+
          '<div class="grow"><div class="name">'+escapeHtml(c.p.name)+' read '+c.rq.pages+' page'+(c.rq.pages>1?'s':'')+'</div>'+
          '<div class="sub">+'+(c.rq.pages*state.data.quranPtsPerPage)+' pts \u00B7 '+timeAgo(c.rq.ts)+'</div></div>'+
          '<button class="icon-btn" style="color:var(--moss);" data-action="approve-quran" data-person="'+c.p.id+'" data-req="'+c.rq.id+'">\u2713</button>'+
          '<button class="icon-btn" style="color:var(--coral);" data-action="decline-quran" data-person="'+c.p.id+'" data-req="'+c.rq.id+'">\u2715</button></div>';
      }).join('') + '</div>';
    }

    // rewards kids redeemed that still need handing over
    if(state.data.owed.length){
      extra += '<div class="card"><p class="field-label">\ud83c\udf81 Rewards to hand over</p>'+ state.data.owed.map(function(o){
        var p = getPerson(o.personId);
        return '<div class="list-row"><div style="font-size:19px;">'+(p?p.avatar:'\ud83c\udf81')+'</div>'+
          '<div class="grow"><div class="name">'+escapeHtml(o.label)+'</div>'+
          '<div class="sub">'+(p?escapeHtml(p.name):'Removed member')+' \u00b7 '+escapeHtml(o.paid)+' \u00b7 '+timeAgo(o.ts)+'</div></div>'+
          '<button class="btn-secondary" style="padding:7px 10px;font-size:12.5px;" data-action="mark-given" data-owed="'+o.id+'">\u2713 Given</button></div>';
      }).join('') + '</div>';
    }

    // today's approved tasks, with undo
    var doneRows = [];
    state.data.people.forEach(function(p){
      if(p.role!=='kid') return;
      var log = todayLogFor(p);
      Object.keys(log.done||{}).forEach(function(itemId){ var it = getItem(itemId); if(it) doneRows.push({p:p, item:it}); });
    });
    var undoHtml = '';
    if(doneRows.length){
      var open = !!state.ui.showApproved;
      undoHtml = '<div class="card"><button class="btn-secondary" style="width:100%;" data-action="toggle-approved">'+
          (open?'\u25b2 Hide':'\u25bc Show')+' today\u2019s approved tasks ('+doneRows.length+') \u2014 undo a mistake</button>'+
        (open ? doneRows.map(function(r){
          return '<div class="list-row"><div style="font-size:19px;">'+r.item.icon+'</div>'+
            '<div class="grow"><div class="name">'+escapeHtml(r.p.name)+' '+r.p.avatar+'</div>'+
            '<div class="sub">'+escapeHtml(r.item.label)+' \u00b7 +'+pointsFor(r.item, r.p)+' pts</div></div>'+
            '<button class="btn-secondary" style="padding:7px 10px;font-size:12.5px;color:var(--coral);" data-action="undo-item" data-person="'+r.p.id+'" data-item="'+r.item.id+'">\u21a9 Undo</button></div>';
        }).join('') : '')+
      '</div>';
    }

    if(!rows.length){
      return (extra || '<div class="empty-state"><span class="em">\u2705</span>All caught up \u2014 no approvals waiting.</div>') + undoHtml;
    }
    var listHtml = rows.map(function(r){
      return '<div class="list-row">'+
        '<div style="font-size:19px;">'+r.item.icon+'</div>'+
        '<div class="grow"><div class="name">'+escapeHtml(r.p.name)+' '+r.p.avatar+'</div>'+
        '<div class="sub">'+escapeHtml(r.item.label)+' \u00B7 +'+pointsFor(r.item, r.p)+' pts</div></div>'+
        '<button class="icon-btn" style="color:var(--moss);" data-action="approve-item" data-person="'+r.p.id+'" data-item="'+r.item.id+'">\u2713</button>'+
        '<button class="icon-btn" style="color:var(--coral);" data-action="decline-item" data-person="'+r.p.id+'" data-item="'+r.item.id+'">\u2715</button>'+
      '</div>';
    }).join('');
    return '<div class="card"><p class="field-label">Waiting for approval</p>'+listHtml+'</div>'+
      '<button class="btn-primary" data-action="approve-all" style="margin-bottom:14px;">Approve all tasks ('+rows.length+')</button>'+
      extra + undoHtml;
  }

      title='Reset everything?'; body='This wipes all family members, points, rewards, and history back to defaults for everyone. This can\u2019t be undone.';

    return '<div class="modal-overlay" data-action="close-modal"><div class="modal-card" data-action="stop">'+

      '<div class="modal-actions"><button class="btn-ghost" data-action="close-modal">Cancel</button>'+

  function renderConfetti(){

      html = '<div class="screen" style="--accent:'+(k?ACCENTS[k.accent]:'var(--moss)')+'">'+body+'</div>';
    }
    else if(name==='person') html = renderParentPerson();
    else if(name==='parent') html = state.parentUnlocked ? renderParent() : renderParentLock();
    else { name = 'home'; html = renderHome(); }
    var active = state.route.name==='person' ? 'home' : state.route.name;
    // keep scroll position when re-rendering the same screen (e.g. after tapping a quest)
    var key = active + '|' + (state.ui.kidId||'') + '|' + (state.route.tab||'');
    var y = window.scrollY;
    html += renderTabbar(active) + renderModal() + renderToast() + renderConfetti();
    document.getElementById('app').innerHTML = html;
    if(render.lastKey === key) window.scrollTo(0, y); else window.scrollTo(0, 0);

  // The Perfect Day bonus is no longer automatic: once every task is
  // approved, the kid's "Claim Perfect Day Bonus" button unlocks.
  function awardItem(p, item, log){
    log.done[item.id] = true;
    var pts = pointsFor(item, p);
    log.awarded = log.awarded || {};
    log.awarded[item.id] = pts;            // remember what was given, for an exact undo
    earn(p, pts, item.section);
    addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label, points:pts});
  }
  // Used by a parent's Undo. If the Perfect Day bonus was already claimed
  // and the day is no longer complete, that bonus is taken back too.
  function unawardItem(p, item, log){
    delete log.done[item.id];
    var pts = (log.awarded && typeof log.awarded[item.id]==='number') ? log.awarded[item.id] : pointsFor(item, p);
    if(log.awarded) delete log.awarded[item.id];
    unearn(p, pts, item.section);
    addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label+' (undone)', points:-pts});
    if(log.perfectGiven && !allTasksDone(p)){
      log.perfectGiven = false;
      undoStreak(p);
      unearn(p, PERFECT_DAY_BONUS, 'bonus');
      addHistory({personId:p.id, kind:'bonus', category:'bonus', label:'Perfect Day bonus removed', points:-PERFECT_DAY_BONUS});
    }
  }

  actions['undo-item'] = function(el){

  actions['toggle-item'] = function(el){
    var p = getPerson(el.dataset.person), item = getItem(el.dataset.item);
    if(!p || !item) return;
    var log = todayLogFor(p);

    if(p.role === 'kid'){
      // kids can't award themselves points directly \u2014 taps go into a
      // pending queue that a parent reviews in Parent Mode > Approvals.
      if(log.done[item.id]){
        showToast('Already approved \u2014 ask a parent to change this');
        return;
      }
      if(log.pending[item.id]){
        delete log.pending[item.id]; // cancel their own pending request
        showToast('Request canceled');
      } else {
        log.pending[item.id] = true;
        showToast('Sent to a parent for approval \u23F3');
      }
      persist(); render();
      return;
    }

    // parents self-track instantly for their own accountability, but don't
    // play the points/rewards game \u2014 just a plain checkmark, no score.
    if(log.done[item.id]){
      delete log.done[item.id];
      addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label, points:0});
    } else {
      log.done[item.id] = true;
      addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label, points:0});
    }
    persist(); render();
  };

  actions['do-redeem'] = function(el){
    var p = getPerson(el.dataset.person), rw = getReward(el.dataset.reward);
    if(!p || !rw){ state.modal=null; render(); return; }
    var paid;
    if(el.dataset.pay === 'cash'){
      var price = cashPriceFor(rw);
      if(p.savings < price){ showToast('Not enough money','error'); state.modal=null; render(); return; }
      p.savings = Math.round((p.savings - price)*100)/100;
      addHistory({personId:p.id, kind:'redeem_cash', category:rw.category, label:rw.label+' (paid with money)', amount:price});
      paid = state.data.currency+' '+fmtMoney(price);
    } else {
      if(spendablePoints(p) < rw.cost){ showToast('Not enough points','error'); state.modal=null; render(); return; }
      p.points -= rw.cost;
      addHistory({personId:p.id, kind:'redeem', category:rw.category, label:rw.label, points:rw.cost});
      paid = rw.cost+' pts';
    }
    // goes on the parents' "Rewards to hand over" list
    state.data.owed.push({id:uid('ow'), personId:p.id, label:rw.label, paid:paid, ts:Date.now()});

    var input = document.getElementById('convertPtsInput');

    if(pts > avail){ showToast('You can convert up to '+avail+' points','error'); return; }
    p.convertRequests.push({id:uid('cv'), pts:pts, ts:Date.now()});

    showToast('Sent to a parent for approval \u23F3');
    persist(); render();
  };

    if(!p) return;
    var rq = p.convertRequests.filter(function(r){ return r.id===el.dataset.req; })[0];
    if(!rq) return;
    p.convertRequests = p.convertRequests.filter(function(r){ return r.id!==rq.id; });
    if(p.points < rq.pts){ showToast(p.name+' no longer has enough points','error'); persist(); render(); return; }
    var amt = pointsToCash(rq.pts);
    p.points -= rq.pts;
    p.savings = Math.round((p.savings + amt)*100)/100;
    addHistory({personId:p.id, kind:'convert', label:'Converted '+rq.pts+' pts to money', points:rq.pts, amount:amt});

      var n = Math.floor(parseFloat(v)); if(!isNaN(n) && n>=0) kp[inp.dataset.kid] = clamp(n,0,100);
    });
    it.days = days.length >= 7 ? null : days.sort();
    it.forKids = kids.length >= allKids.length ? null : kids;
    it.kidPoints = kp;
    state.modal = null;
    showToast('Saved \u2014 '+daysLabel(it)+' \u00B7 '+kidsLabel(it)); persist(); render();
  };

  // streak protection
  actions['toggle-excuse'] = function(el){
    var p = getPerson(el.dataset.person), key = el.dataset.day;
    if(!p || !key) return;
    if(!p.excused) p.excused = {};
    if(p.excused[key]) delete p.excused[key]; else p.excused[key] = true;
    // keep ~60 days of rest days
    Object.keys(p.excused).sort().slice(0, -60).forEach(function(k){ delete p.excused[k]; });
    showToast(p.excused[key] ? 'Rest day saved \u2014 '+p.name+'\u2019s streak is safe \uD83D\uDE37' : 'Rest day removed');
    persist(); render();
  };

  // Quran tracker
  actions['open-quran'] = function(el){ state.modal = {type:'quranLog', personId: el.dataset.person}; render(); };
  actions['submit-quran'] = function(el){
    var p = getPerson(el.dataset.person), inp = document.getElementById('quranPagesInput');
    var n = inp ? Math.floor(parseFloat(inp.value)) : NaN;
    if(!p){ state.modal=null; render(); return; }
    if(!n || isNaN(n) || n < 1){ showToast('How many pages? Enter a number','error'); return; }
    if(n > 60){ showToast('That\u2019s a lot! Max 60 pages at a time','error'); return; }
    p.quranRequests.push({id:uid('qr'), pages:n, ts:Date.now()});
    state.modal = null;
    showToast('Sent to a parent for approval \u23F3'); persist(); render();
  };
  actions['approve-quran'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    var rq = p.quranRequests.filter(function(r){ return r.id===el.dataset.req; })[0];
    if(!rq) return;
    p.quranRequests = p.quranRequests.filter(function(r){ return r.id!==rq.id; });
    var pts = rq.pages * state.data.quranPtsPerPage;
    if(pts) earn(p, pts, 'quran');
    addHistory({personId:p.id, kind:'daily', category:'quran', label:'Read '+rq.pages+' page'+(rq.pages>1?'s':'')+' of Quran', points:pts});
    p.quran.pagesTotal += rq.pages;
    p.quran.page += rq.pages;
    var khatm = false;
    while(p.quran.page >= QURAN_PAGES){
      p.quran.page -= QURAN_PAGES; p.quran.khatms += 1; khatm = true;
      earn(p, KHATM_BONUS, 'quran');
      addHistory({personId:p.id, kind:'bonus', category:'quran', label:'\uD83C\uDF89 Completed the whole Quran (khatm)!', points:KHATM_BONUS});
    }
    if(khatm){ burstConfetti(); showToast('MashaAllah! '+p.name+' completed the Quran! +'+KHATM_BONUS+' \uD83C\uDF89'); }
    else showToast('Approved: '+rq.pages+' pages for '+p.name+' (+'+pts+')');
    persist(); render();
  };
  actions['decline-quran'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    p.quranRequests = p.quranRequests.filter(function(r){ return r.id!==el.dataset.req; });
    showToast('Declined'); persist(); render();
  };
  actions['quranrate-inc'] = function(){ state.data.quranPtsPerPage = clamp(state.data.quranPtsPerPage+1, 0, 20); persist(); render(); };
  actions['quranrate-dec'] = function(){ state.data.quranPtsPerPage = clamp(state.data.quranPtsPerPage-1, 0, 20); persist(); render(); };

  // backups
  actions['show-backups'] = function(){
    state.ui.backups = 'loading'; render();
    listBackups().then(function(rows){ state.ui.backups = rows; state.ui.backupRows = rows; render(); })
      .catch(function(){ state.ui.backups = []; render(); });
  };
  actions['export-data'] = function(){
    var blob = new Blob([JSON.stringify(state.data, null, 1)], {type:'application/json'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'barakah-garden-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    showToast('Backup downloaded \u2B07\uFE0F');
  };
  actions['ask-restore'] = function(el){
    var row = (state.ui.backupRows||[]).filter(function(r){ return r.week===el.dataset.week; })[0];
    if(!row) return;
    state.ui.restoreJson = row.json;
    state.modal = {type:'confirmRestore', week: row.week}; render();
  };
  actions['do-restore'] = function(){
    var raw = state.ui.restoreJson;
    state.modal = null;
    if(!raw){ render(); return; }
    try{
      restoreData(JSON.parse(raw)).then(function(){ showToast('Backup restored \u2705'); })
        .catch(function(e){ console.error(e); showToast('Restore failed','error'); });
    }catch(e){ showToast('That backup file can\u2019t be read','error'); render(); }
  };

  actions['adjust-pick-person'] = function(el){ ensureAdjustUi(); state.ui.adjust.personId = el.dataset.person; render(); };
  actions['adjust-set-mode'] = function(el){ ensureAdjustUi(); state.ui.adjust.mode = el.dataset.mode; render(); };
  actions['adjust-pts-inc'] = function(){ ensureAdjustUi(); state.ui.adjust.points = clamp(state.ui.adjust.points+1,1,200); render(); };
  actions['adjust-pts-dec'] = function(){ ensureAdjustUi(); state.ui.adjust.points = clamp(state.ui.adjust.points-1,1,200); render(); };
  actions['adjust-submit'] = function(){
    ensureAdjustUi();
    var a = state.ui.adjust;
    var p = getPerson(a.personId);
    if(!p){ showToast('Pick someone first','error'); return; }
    var inputEl = document.getElementById('adjustLabelInput');
    var label = (inputEl && inputEl.value.trim()) || a.label || (a.mode==='give' ? 'Bonus' : 'Correction');
    var pts = a.points || 1;
    if(a.mode==='give'){
      earn(p, pts, 'bonus');
      addHistory({personId:p.id, kind:'bonus', category:'bonus', label:label, points:pts});
      showToast('+'+pts+' pts for '+p.name+' \u2014 '+label+' \uD83C\uDF89'); burstConfetti();
    } else {
      // Penalty: lowers spendable points and the star score, but the tree
      // (totalLifetime) never shrinks \u2014 it only ever grows.
      var taken = Math.min(pts, p.points);
      p.points -= taken;
      tally(p, -pts);
      addHistory({personId:p.id, kind:'bonus', category:'bonus', label:label+' (penalty)', points:-pts});
      showToast(pts+' pts removed from '+p.name);
    }
    state.ui.adjust.label = ''; persist(); render();
  };

  actions['member-save-name'] = function(el){
    var p = getPerson(el.dataset.person);
    var input = document.getElementById('nameInput_'+el.dataset.person);
    if(p && input && input.value.trim()){ p.name = input.value.trim(); showToast('Name updated'); persist(); render(); }
  };
  actions['member-set-avatar'] = function(el){ var p = getPerson(el.dataset.person); if(p){ p.avatar = el.dataset.avatar; persist(); render(); } };
  actions['member-set-accent'] = function(el){ var p = getPerson(el.dataset.person); if(p){ p.accent = el.dataset.accent; persist(); render(); } };
  actions['member-set-role'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    p.role = el.dataset.role;
    if(!p.hero) p.hero = defaultHero(null, p.role==='parent');   // Members card will ask boy/girl or male/female
    else if(DEFAULT_TITLES.indexOf(p.hero.title||'')!==-1) p.hero.title = defaultTitle(p.hero.gender, p.role==='parent');
    persist(); render();
  };
  actions['add-member'] = function(el){
    var role = el.dataset.role === 'parent' ? 'parent' : 'kid';
    // for a kid, first ask boy or girl so the right hero picture is used
    if(role==='kid' && !el.dataset.gender){ state.modal = {type:'newKid'}; render(); return; }
    var used = state.data.people.map(function(p){ return p.accent; });
    var freeAccent = ACCENT_KEYS.filter(function(a){ return used.indexOf(a)===-1; })[0] || ACCENT_KEYS[state.data.people.length % ACCENT_KEYS.length];
    var usedAv = state.data.people.map(function(p){ return p.avatar; });
    var freeAvatar = AVATARS.filter(function(a){ return usedAv.indexOf(a)===-1; })[0] || AVATARS[state.data.people.length % AVATARS.length];
    var np = freshPerson(role==='parent' ? 'New Parent' : 'New Kid', freeAvatar, freeAccent, role);
    if(role==='parent') np.hero = defaultHero(null, true);
    if(role==='kid'){
      var g = el.dataset.gender==='girl' ? 'girl' : 'boy';
      np.hero = defaultHero(g);
      var emb = HERO_EMBLEM_KEYS.filter(function(e){ return !state.data.people.some(function(o){ return o.hero && o.hero.emblem===e; }); })[0];
      if(emb) np.hero.emblem = emb;
    }
    state.data.people.push(np);
    state.modal = null;
    showToast('Added \u2014 rename them below'); persist(); render();
  };
  actions['member-hero'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    if(!p.hero) p.hero = defaultHero(null, p.role==='parent');
    var f = el.dataset.field, v = el.dataset.value;
    if(f==='gender'){
      var wasDefault = DEFAULT_TITLES.indexOf(p.hero.title||'') !== -1;
      p.hero.gender = v==='girl' ? 'girl' : 'boy';
      if(wasDefault) p.hero.title = defaultTitle(p.hero.gender, p.role==='parent');
    }
    else if(f==='emblem' && HERO_EMBLEMS[v]) p.hero.emblem = v;
    else if(f==='cape' && CAPES[v]) p.hero.cape = v;
    else if(f==='skin') p.hero.skin = clamp(parseInt(v,10)||0, 0, SKINS.length-1);
    persist(); render();
  };
  actions['member-save-hero-title'] = function(el){
    var p = getPerson(el.dataset.person), input = document.getElementById('heroTitle_'+el.dataset.person);
    if(!p || !input) return;
    if(!p.hero) p.hero = defaultHero();
    p.hero.title = input.value.trim().slice(0, 30);
    showToast('Hero name saved \ud83e\uddb8'); persist(); render();
  };
  actions['ask-reset-person'] = function(el){ state.modal={type:'confirmResetPerson', personId:el.dataset.person}; render(); };
  actions['do-reset-person'] = function(el){
    var p = getPerson(el.dataset.person);
    if(p){
      p.points=0; p.totalLifetime=0; p.savings=0; p.charityGiven=0;
      ['prayers','azkar','charity','habits','bonus','quran','games'].forEach(function(c){ p.lifetime[c]=0; });
      p.todayLog = {date: todayStr(), done:{}, pending:{}, perfectGiven:false};
      p.dayPts = {}; p.convertRequests = []; p.streak = {count:0, last:null}; p.starsWon = 0; p.goalId = null;
      p.excused = {}; p.quran = {page:0, khatms:0, pagesTotal:0}; p.quranRequests = [];
      p.gamesPlayed = []; p.gamePlays = null; p.gamePasses = 0; p.passRequests = []; p.gameDay = null;
      state.data.history = state.data.history.filter(function(h){ return h.personId !== p.id; });
      state.data.owed = state.data.owed.filter(function(o){ return o.personId !== p.id; });
    }
    state.modal=null; showToast('Stats reset'); persist(); render();
  };
  actions['ask-remove-person'] = function(el){ state.modal={type:'confirmRemovePerson', personId:el.dataset.person}; render(); };
  actions['do-remove-person'] = function(el){
    if(state.data.people.length<=1){ state.modal=null; render(); return; }
    state.data.people = state.data.people.filter(function(p){ return p.id !== el.dataset.person; });
    state.data.history = state.data.history.filter(function(h){ return h.personId !== el.dataset.person; });
    state.data.owed = state.data.owed.filter(function(o){ return o.personId !== el.dataset.person; });
    state.modal=null; showToast('Member removed'); persist(); render();
  };

  actions['save-currency'] = function(){
    var el = document.getElementById('currencyInput');
    var v = el && el.value.trim();
    if(!v){ showToast('Enter a currency label','error'); return; }
    state.data.currency = v.slice(0,6);
    showToast('Currency updated'); persist(); render();
  };
  actions['save-pin'] = function(){
    var p1 = document.getElementById('newPin1'), p2 = document.getElementById('newPin2');
    var v1 = p1 && p1.value.trim(), v2 = p2 && p2.value.trim();
    if(!/^\d{4}$/.test(v1||'')){ showToast('PIN must be 4 digits','error'); return; }
    if(v1 !== v2){ showToast('PINs don\u2019t match','error'); return; }
    state.data.pin = v1; showToast('PIN updated'); persist(); render();
  };
  actions['ask-reset-all'] = function(){ state.modal={type:'confirmResetAll'}; render(); };
  actions['do-reset-all'] = function(){
    state.data = defaultData(); state.modal=null; state.parentUnlocked=false; state.route={name:'home'};
    showToast('Everything reset'); persist(); render();
  };

  /* ============ event delegation ============ */
  document.getElementById('app-root').addEventListener('change', function(e){
    var el = e.target;
    if(el && el.dataset.change === 'photo-file' && el.files && el.files[0]){
      loadPhotoFile(el.files[0], el.dataset.person); el.value = ''; return;
    }
    if(!el || el.dataset.change !== 'import-file' || !el.files || !el.files[0]) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var obj = JSON.parse(reader.result);
        if(!obj || !Array.isArray(obj.people)) throw new Error('not a backup');
        state.ui.restoreJson = reader.result;
        state.modal = {type:'confirmRestore', week:null}; render();
      }catch(err){ showToast('That file isn\u2019t a Barakah Garden backup','error'); }
    };
    reader.readAsText(el.files[0]);
    el.value = '';
  });
  document.getElementById('app-root').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var fn = actions[el.dataset.action];
    if(fn) fn(el, e);
  });

  /* ============ installable app (PWA) ============ */
  var installPrompt = null;
  function isStandalone(){ return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
  window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); installPrompt = e; if(state.data) render(); });
  window.addEventListener('appinstalled', function(){ installPrompt = null; showToast('Barakah Garden installed \uD83C\uDF89'); });
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(e){ console.warn('service worker not registered', e); }); });
  }
  actions['install-app'] = function(){
    if(installPrompt){ installPrompt.prompt(); installPrompt.userChoice.then(function(){ installPrompt = null; render(); }); }
    else { state.modal = {type:'installHelp'}; render(); }
  };

  /* ============ init (Firebase) ============ */
  function init(){
    document.getElementById('app').innerHTML = renderLoading();
    state.data = defaultData(); // shown briefly until the real data arrives
    if(typeof firebase === 'undefined' || !FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === 'PASTE_YOUR_API_KEY'){
      showFatalError('Firebase isn\u2019t set up yet in this file.');
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      auth = firebase.auth();
    }catch(e){
      console.error(e);
      showFatalError('Could not start Firebase \u2014 check FIREBASE_CONFIG values.');
      return;
    }
    auth.onAuthStateChanged(function(user){
      if(user){ attachListener(); }
      else {
        auth.signInAnonymously().catch(function(e){
          console.error(e);
          showFatalError('Sign-in failed. Check that Anonymous sign-in is enabled in Firebase Authentication.');
        });
      }
    });
  }
  init();

})();
</script>
