      var rate = state.data.pointsPerCurrency, cur = state.data.currency;
      return '<div class="modal-overlay" data-action="close-modal"><div class="modal-card" data-action="stop">'+
        '<h3 class="disp">Ask to convert points</h3>'+
        '<p>'+escapeHtml(kid.name)+' can convert <strong>'+spendablePoints(kid)+' pts</strong>. '+rate+' pts = '+escapeHtml(cur)+' 1 (minimum '+MIN_CONVERT+' pts). A parent approves it, then the money goes into the Money tab. The tree keeps growing either way.</p>'+
        '<input class="text-input" id="convertPtsInput" type="number" min="'+MIN_CONVERT+'" step="'+rate+'" placeholder="Points to convert, e.g. '+MIN_CONVERT+'">'+
        '<button class="btn-secondary" style="width:100%;margin-bottom:12px;" data-action="convert-all" data-person="'+kid.id+'">Use all my points ('+spendablePoints(kid)+')</button>'+
        '<div class="modal-actions"><button class="btn-ghost" data-action="close-modal">Cancel</button>'+
        '<button class="btn-primary" data-action="do-convert" data-person="'+kid.id+'">Send to parent</button></div>'+
      '</div></div>';
    }
    if(m.type==='newKid'){
      return '<div class="modal-overlay" data-action="close-modal"><div class="modal-card" data-action="stop">'+
        '<h3 class="disp">Add a kid</h3>'+
        '<p>Is the new kid a boy or a girl? This picks the right superhero picture. You can rename them and change the look afterwards.</p>'+
        '<div class="modal-actions">'+
          '<button class="btn-primary" style="background:var(--sky,#4E85B0);" data-action="add-member" data-role="kid" data-gender="boy">👦 Boy</button>'+
          '<button class="btn-primary" data-action="add-member" data-role="kid" data-gender="girl">👧 Girl</button>'+
        '</div>'+
        '<button class="btn-ghost" style="width:100%;margin-top:10px;box-shadow:none;" data-action="close-modal">Cancel</button>'+
      '</div></div>';
    }
    if(m.type==='editReward'){
      var er = getReward(m.rewardId);
      if(!er){ state.modal=null; return ''; }
      var catBtns = REWARD_CAT_ORDER.map(function(c){ return '<button class="seg-btn '+(m.category===c?'active':'')+'" data-action="edit-reward-cat" data-cat="'+c+'">'+REWARD_CATS[c].icon+'</button>'; }).join('');
      return '<div class="modal-overlay" data-action="close-modal"><div class="modal-card" data-action="stop">'+
        '<h3 class="disp">Edit reward</h3>'+
        '<p class="field-label">Name</p><input class="text-input" id="editRewardLabel" type="text" value="'+escapeHtml(er.label)+'">'+
        '<p class="field-label">Points</p><input class="text-input" id="editRewardCost" type="number" min="1" value="'+er.cost+'">'+
        '<p class="field-label">Money price ('+escapeHtml(state.data.currency)+') — blank = '+ptsLabel(state.data.pointsPerCurrency)+' per 1</p>'+
        '<input class="text-input" id="editRewardCash" type="number" min="0" step="0.5" value="'+(er.cashPrice!=null?er.cashPrice:'')+'" placeholder="'+fmtMoney(pointsToCash(er.cost))+'">'+
        '<p class="field-label">Category</p><div class="seg-row">'+catBtns+'</div>'+
        '<div class="modal-actions"><button class="btn-ghost" data-action="close-modal">Cancel</button>'+
        '<button class="btn-primary" data-action="save-reward-edit" data-reward="'+er.id+'">Save</button></div>'+
      '</div></div>';
    }
    var title='', body='', confirmLabel='Confirm', confirmAction='', pAttr='', rAttr='', payAttr='';
    if(m.type==='confirmRedeem'){
      var pr = getPerson(m.personId), rw = getReward(m.rewardId);
      if(!pr || !rw){ state.modal=null; return ''; }
      var payCash = m.pay === 'cash';
      var priceTxt = payCash ? state.data.currency+' '+fmtMoney(cashPriceFor(rw))+' from their money' : rw.cost+' points';
      title='Redeem reward?'; body='Use <strong>'+escapeHtml(priceTxt)+'</strong> to redeem "'+escapeHtml(rw.label)+'" for '+escapeHtml(pr.name)+'?';
      confirmAction='do-redeem'; confirmLabel='Redeem'; pAttr=pr.id; rAttr=rw.id; payAttr = payCash ? 'cash' : 'points';
    } else if(m.type==='confirmResetPerson'){
      var p2 = getPerson(m.personId);
      if(!p2){ state.modal=null; return ''; }
      title='Reset stats?'; body='This clears '+escapeHtml(p2.name)+'\u2019s points, growth, and activity history. This can\u2019t be undone.';
      confirmAction='do-reset-person'; confirmLabel='Reset'; pAttr=p2.id;
    } else if(m.type==='confirmRemovePerson'){
      var p3 = getPerson(m.personId);
      if(!p3){ state.modal=null; return ''; }
      title='Remove '+escapeHtml(p3.name)+'?'; body='This removes their profile and history for good.';
      confirmAction='do-remove-person'; confirmLabel='Remove'; pAttr=p3.id;
    } else if(m.type==='confirmResetAll'){
      title='Reset everything?'; body='This wipes all family members, points, rewards, and history back to defaults for everyone. This can\u2019t be undone.';
      confirmAction='do-reset-all'; confirmLabel='Reset all';
    }
    return '<div class="modal-overlay" data-action="close-modal"><div class="modal-card" data-action="stop">'+
      '<h3 class="disp">'+title+'</h3><p>'+body+'</p>'+
      '<div class="modal-actions"><button class="btn-ghost" data-action="close-modal">Cancel</button>'+
      '<button class="btn-primary" data-action="'+confirmAction+'" data-person="'+pAttr+'" data-reward="'+rAttr+'" data-pay="'+payAttr+'">'+confirmLabel+'</button></div>'+
    '</div></div>';
  }
  function renderToast(){
    if(!state.toast) return '';
    return '<div class="toast '+(state.toast.type==='error'?'error':'')+'">'+escapeHtml(state.toast.msg)+'</div>';
  }
  function renderConfetti(){
    if(!state.confetti) return '';
    var emojis = ['\uD83C\uDF89','\u2B50','\uD83C\uDF38','\uD83C\uDF81','\u2728'];
    var pieces = '';
    for(var i=0;i<18;i++){
      var left = Math.random()*100, delay = (Math.random()*0.4).toFixed(2), em = emojis[i % emojis.length];
      pieces += '<span class="confetti-piece" style="left:'+left+'%;animation-delay:'+delay+'s;">'+em+'</span>';
    }
    return '<div class="confetti-layer">'+pieces+'</div>';
  }

  /* ============ main render ============ */
  function render(){
    var r = state.route, name = r.name, html;
    if(name==='parent-lock') name = r.name = 'parent';
    heroSeq = 0;
    if(name==='quests' || name==='journey' || name==='shop'){
      var k = currentKid();
      var body = !k ? '<div class="empty-state"><span class="em">🌱</span>No kids yet — add one in Parent Mode → Members.</div>'
        : name==='quests' ? renderQuests(k) : name==='journey' ? renderJourney(k) : renderShop(k);
      html = '<div class="screen" style="--accent:'+(k?ACCENTS[k.accent]:'var(--moss)')+'">'+body+'</div>';
    }
    else if(name==='person') html = renderParentPerson();
    else if(name==='parent') html = state.parentUnlocked ? renderParent() : renderParentLock();
    else { name = 'home'; html = renderHome(); }
    var active = state.route.name==='person' ? 'home' : state.route.name;
    // keep scroll position when re-rendering the same screen (e.g. after tapping a quest)
    var key = active + '|' + (state.ui.kidId||'') + '|' + (state.route.tab||'');
    var y = window.scrollY;
    html += renderTabbar(active) + renderModal() + renderToast() + renderConfetti();
    document.getElementById('app').innerHTML = html;
    if(render.lastKey === key) window.scrollTo(0, y); else window.scrollTo(0, 0);
    render.lastKey = key;
  }

  /* ============ actions ============ */
  var actions = {};
  actions['stop'] = function(){};
  actions['close-modal'] = function(){ state.modal = null; render(); };
  actions['go-home'] = function(){ state.route = {name:'home'}; state.ui.pinEntry=''; state.ui.pinError=false; render(); };
  actions['manual-sync'] = function(){ manualRefresh(); };
  actions['star-period'] = function(el){ state.ui.starPeriod = el.dataset.period; render(); };

  actions['open-person'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    if(p.role==='kid'){ state.ui.kidId = p.id; state.route = {name:'quests'}; }
    else state.route = {name:'person', personId: p.id, tab:'today'};
    render();
  };
  actions['nav'] = function(el){
    var t = el.dataset.tab;
    if(t==='parent'){
      if(state.route.name==='parent') return;
      state.ui.pinEntry=''; state.ui.pinError=false;
      state.route = {name:'parent', tab:'approvals'};
    } else {
      state.route = {name:t};
    }
    render();
  };
  actions['pick-kid'] = function(el){ state.ui.kidId = el.dataset.person; render(); };
  actions['set-goal'] = function(el){
    var p = getPerson(el.dataset.person), r = getReward(el.dataset.reward);
    if(!p || !r) return;
    p.goalId = r.id; showToast('New goal: '+r.label+' 🎯'); persist(); render();
  };
  actions['toggle-history'] = function(){ state.ui.showHistory = !state.ui.showHistory; render(); };
  actions['person-tab'] = function(el){ state.route = {name:'person', personId: el.dataset.person, tab: el.dataset.tab}; render(); };

  // The Perfect Day bonus is no longer automatic: once every task is
  // approved, the kid's "Claim Perfect Day Bonus" button unlocks.
  function awardItem(p, item, log){
    log.done[item.id] = true;
    earn(p, item.points, item.section);
    addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label, points:item.points});
  }
  // Used by a parent's Undo. If the Perfect Day bonus was already claimed
  // and the day is no longer complete, that bonus is taken back too.
  function unawardItem(p, item, log){
    delete log.done[item.id];
    unearn(p, item.points, item.section);
    addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label+' (undone)', points:-item.points});
    if(log.perfectGiven && !allTasksDone(p)){
      log.perfectGiven = false;
      undoStreak(p);
      unearn(p, PERFECT_DAY_BONUS, 'bonus');
      addHistory({personId:p.id, kind:'bonus', category:'bonus', label:'Perfect Day bonus removed', points:-PERFECT_DAY_BONUS});
    }
  }

  actions['undo-item'] = function(el){
    var p = getPerson(el.dataset.person), item = getItem(el.dataset.item);
    if(!p || !item) return;
    var log = todayLogFor(p);
    if(!log.done[item.id]) return;
    unawardItem(p, item, log);
    showToast('Undone: '+item.label+' for '+p.name+' (\u2212'+item.points+')');
    persist(); render();
  };
  actions['toggle-approved'] = function(){ state.ui.showApproved = !state.ui.showApproved; render(); };

  actions['claim-perfect-day'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p || p.role!=='kid') return;
    var log = todayLogFor(p);
    if(log.perfectGiven){ showToast('Already claimed today \uD83C\uDF1F'); return; }
    if(!allTasksDone(p)){ showToast('Finish all of today\u2019s tasks first','error'); return; }
    log.perfectGiven = true;
    earn(p, PERFECT_DAY_BONUS, 'bonus');
    bumpStreak(p);
    addHistory({personId:p.id, kind:'bonus', category:'bonus', label:'Perfect Day!', points:PERFECT_DAY_BONUS});
    burstConfetti();
    showToast(p.name+' had a Perfect Day! +'+PERFECT_DAY_BONUS+' \uD83C\uDF1F \u00B7 \uD83D\uDD25 '+streakOf(p)+'-day streak');
    persist(); render();
  };

  actions['toggle-item'] = function(el){
    var p = getPerson(el.dataset.person), item = getItem(el.dataset.item);
    if(!p || !item) return;
    var log = todayLogFor(p);

    if(p.role === 'kid'){
      // kids can't award themselves points directly \u2014 taps go into a
      // pending queue that a parent reviews in Parent Mode > Approvals.
      if(log.done[item.id]){
        showToast('Already approved \u2014 ask a parent to change this');
        return;
      }
      if(log.pending[item.id]){
        delete log.pending[item.id]; // cancel their own pending request
        showToast('Request canceled');
      } else {
        log.pending[item.id] = true;
        showToast('Sent to a parent for approval \u23F3');
      }
      persist(); render();
      return;
    }

    // parents self-track instantly for their own accountability, but don't
    // play the points/rewards game \u2014 just a plain checkmark, no score.
    if(log.done[item.id]){
      delete log.done[item.id];
      addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label, points:0});
    } else {
      log.done[item.id] = true;
      addHistory({personId:p.id, kind:'daily', category:item.section, label:item.label, points:0});
    }
    persist(); render();
  };

  actions['approve-item'] = function(el){
    var p = getPerson(el.dataset.person), item = getItem(el.dataset.item);
    if(!p || !item) return;
    var log = todayLogFor(p);
    if(!log.pending[item.id]) return;
    delete log.pending[item.id];
    awardItem(p, item, log);
    showToast('Approved: '+item.label+' for '+p.name+' (+'+item.points+')');
    persist(); render();
  };
  actions['decline-item'] = function(el){
    var p = getPerson(el.dataset.person), item = getItem(el.dataset.item);
    if(!p || !item) return;
    var log = todayLogFor(p);
    delete log.pending[item.id];
    showToast('Declined');
    persist(); render();
  };
  actions['approve-all'] = function(){
    var count = 0;
    state.data.people.forEach(function(p){
      var log = todayLogFor(p);
      Object.keys(log.pending).forEach(function(itemId){
        var item = getItem(itemId);
        if(!item) { delete log.pending[itemId]; return; }
        delete log.pending[itemId];
        awardItem(p, item, log);
        count++;
      });
    });
    if(count){ showToast('Approved '+count+' item'+(count===1?'':'s')+' \u2705'); persist(); render(); }
  };

  actions['open-parent-lock'] = function(){ state.parentUnlocked=false; state.ui.pinEntry=''; state.ui.pinError=false; state.route={name:'parent-lock'}; render(); };
  actions['pin-digit'] = function(el){
    if(!state.ui.pinEntry) state.ui.pinEntry='';
    if(state.ui.pinEntry.length>=4) return;
    state.ui.pinEntry += el.dataset.digit;
    state.ui.pinError = false;
    if(state.ui.pinEntry.length===4){
      if(state.ui.pinEntry===state.data.pin){
        state.parentUnlocked=true; state.ui.pinEntry='';
        state.route={name:'parent', tab:'approvals'}; render(); return;
      } else {
        state.ui.pinError=true; render();
        setTimeout(function(){ state.ui.pinEntry=''; state.ui.pinError=false; render(); }, 700);
        return;
      }
    }
    render();
  };
  actions['pin-back'] = function(){ state.ui.pinEntry=(state.ui.pinEntry||'').slice(0,-1); render(); };

  actions['exit-parent'] = function(){ state.parentUnlocked=false; state.route={name:'home'}; render(); };
  actions['parent-tab'] = function(el){ state.route = {name:'parent', tab: el.dataset.tab}; render(); };

  actions['ask-redeem'] = function(el){ state.modal={type:'confirmRedeem', personId:el.dataset.person, rewardId:el.dataset.reward, pay: el.dataset.pay==='cash'?'cash':'points'}; render(); };
  actions['do-redeem'] = function(el){
    var p = getPerson(el.dataset.person), rw = getReward(el.dataset.reward);
    if(!p || !rw){ state.modal=null; render(); return; }
    var paid;
    if(el.dataset.pay === 'cash'){
      var price = cashPriceFor(rw);
      if(p.savings < price){ showToast('Not enough money','error'); state.modal=null; render(); return; }
      p.savings = Math.round((p.savings - price)*100)/100;
      addHistory({personId:p.id, kind:'redeem_cash', category:rw.category, label:rw.label+' (paid with money)', amount:price});
      paid = state.data.currency+' '+fmtMoney(price);
    } else {
      if(spendablePoints(p) < rw.cost){ showToast('Not enough points','error'); state.modal=null; render(); return; }
      p.points -= rw.cost;
      addHistory({personId:p.id, kind:'redeem', category:rw.category, label:rw.label, points:rw.cost});
      paid = rw.cost+' pts';
    }
    // goes on the parents' "Rewards to hand over" list
    state.data.owed.push({id:uid('ow'), personId:p.id, label:rw.label, paid:paid, ts:Date.now()});
    state.modal=null;
    showToast(p.name+' redeemed '+rw.label+' \uD83C\uDF89');
    burstConfetti(); persist(); render();
  };
  actions['mark-given'] = function(el){
    state.data.owed = state.data.owed.filter(function(o){ return o.id !== el.dataset.owed; });
    showToast('Marked as given \u2705'); persist(); render();
  };

  // Points -> money: kids send a request; a parent approves it in Approvals.
  actions['open-convert'] = function(el){ state.modal = {type:'convert', personId: el.dataset.person}; render(); };
  actions['convert-all'] = function(el){
    var p = getPerson(el.dataset.person), input = document.getElementById('convertPtsInput');
    if(p && input) input.value = spendablePoints(p);
  };
  actions['do-convert'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p || p.role!=='kid'){ state.modal=null; render(); return; }
    var input = document.getElementById('convertPtsInput');
    var pts = input ? Math.floor(parseFloat(input.value)) : NaN;
    var avail = spendablePoints(p);
    if(!pts || isNaN(pts) || pts <= 0){ showToast('Enter how many points to convert','error'); return; }
    if(pts < MIN_CONVERT){ showToast('Minimum is '+MIN_CONVERT+' points','error'); return; }
    if(pts > avail){ showToast('You can convert up to '+avail+' points','error'); return; }
    p.convertRequests.push({id:uid('cv'), pts:pts, ts:Date.now()});
    state.modal = null;
    showToast('Sent to a parent for approval \u23F3');
    persist(); render();
  };
  actions['approve-convert'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    var rq = p.convertRequests.filter(function(r){ return r.id===el.dataset.req; })[0];
    if(!rq) return;
    p.convertRequests = p.convertRequests.filter(function(r){ return r.id!==rq.id; });
    if(p.points < rq.pts){ showToast(p.name+' no longer has enough points','error'); persist(); render(); return; }
    var amt = pointsToCash(rq.pts);
    p.points -= rq.pts;
    p.savings = Math.round((p.savings + amt)*100)/100;
    addHistory({personId:p.id, kind:'convert', label:'Converted '+rq.pts+' pts to money', points:rq.pts, amount:amt});
    showToast(rq.pts+' pts \u2192 '+state.data.currency+' '+fmtMoney(amt)+' for '+p.name+' \uD83D\uDCB0');
    persist(); render();
  };
  actions['decline-convert'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    p.convertRequests = p.convertRequests.filter(function(r){ return r.id!==el.dataset.req; });
    showToast('Conversion declined'); persist(); render();
  };

  // Edit an existing reward (name, points, money price, category)
  actions['edit-reward'] = function(el){
    var r = getReward(el.dataset.reward);
    if(r){ state.modal = {type:'editReward', rewardId:r.id, category:r.category}; render(); }
  };
  actions['edit-reward-cat'] = function(el){
    // update without re-rendering so typed values aren't lost
    if(!state.modal) return;
    state.modal.category = el.dataset.cat;
    Array.prototype.forEach.call(el.parentNode.children, function(b){ b.classList.toggle('active', b===el); });
  };
  actions['save-reward-edit'] = function(el){
    var r = getReward(el.dataset.reward);
    if(!r){ state.modal=null; render(); return; }
    var label = (document.getElementById('editRewardLabel').value||'').trim();
    var cost = Math.floor(parseFloat(document.getElementById('editRewardCost').value));
    var cashRaw = document.getElementById('editRewardCash').value;
    var cash = parseFloat(cashRaw);
    if(!label){ showToast('Reward needs a name','error'); return; }
    if(!cost || isNaN(cost) || cost < 1){ showToast('Points must be 1 or more','error'); return; }
    r.label = label; r.cost = cost;
    if(state.modal && REWARD_CATS[state.modal.category]) r.category = state.modal.category;
    if(cashRaw.trim()==='' || isNaN(cash) || cash <= 0) delete r.cashPrice; else r.cashPrice = Math.round(cash*100)/100;
    state.modal = null;
    showToast('Reward updated \u2728'); persist(); render();
  };

  actions['rate-inc'] = function(){ state.data.pointsPerCurrency = clamp(state.data.pointsPerCurrency+1,1,1000); persist(); render(); };
  actions['rate-dec'] = function(){ state.data.pointsPerCurrency = clamp(state.data.pointsPerCurrency-1,1,1000); persist(); render(); };

  actions['open-money-form'] = function(el){ state.modal = {type:'moneyEntry', personId: el.dataset.person, kind: el.dataset.kind}; render(); };
  actions['submit-money'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p){ state.modal=null; render(); return; }
    var amtEl = document.getElementById('moneyAmountInput');
    var noteEl = document.getElementById('moneyNoteInput');
    var amt = amtEl ? parseFloat(amtEl.value) : NaN;
    if(!amt || isNaN(amt) || amt<=0){ showToast('Enter an amount first','error'); return; }
    var note = (noteEl && noteEl.value.trim()) || '';
    var kind = el.dataset.kind;
    if(kind==='savings'){ p.savings += amt; }
    else { p.charityGiven += amt; }
    addHistory({personId:p.id, kind:kind, amount:amt, label: note || (kind==='savings' ? 'Savings added' : 'Charity given')});
    state.modal = null;
    showToast((kind==='savings'?'Savings':'Charity')+' updated for '+p.name);
    persist(); render();
  };

  actions['reward-pick-cat'] = function(el){ ensureRewardUi(); state.ui.reward.category = el.dataset.cat; render(); };
  // bigger steps for bigger rewards: 5 up to 100, 25 up to 500, 100 after that
  function rewardStep(cost, up){ var c = up ? cost : cost-1; return c < 100 ? 5 : c < 500 ? 25 : 100; }
  function keepRewardLabel(){ var i = document.getElementById('rewardLabelInput'); if(i) state.ui.reward.label = i.value; }
  actions['reward-pts-inc'] = function(){ ensureRewardUi(); keepRewardLabel(); var c = state.ui.reward.cost; state.ui.reward.cost = clamp(c+rewardStep(c,true),5,10000); render(); };
  actions['reward-pts-dec'] = function(){ ensureRewardUi(); keepRewardLabel(); var c = state.ui.reward.cost; state.ui.reward.cost = clamp(c-rewardStep(c,false),5,10000); render(); };
  actions['add-reward'] = function(){
    ensureRewardUi();
    var input = document.getElementById('rewardLabelInput');
    var label = input && input.value.trim();
    if(!label){ showToast('Type a reward name first','error'); return; }
    var r = state.ui.reward;
    var cashEl = document.getElementById('rewardCashInput');
    var cash = cashEl ? parseFloat(cashEl.value) : NaN;
    var newRw = {id:uid('rw'), label:label, cost:r.cost, category:r.category};
    if(!isNaN(cash) && cash > 0) newRw.cashPrice = Math.round(cash*100)/100;
    state.data.rewards.push(newRw);
    state.ui.reward = {label:'', category:r.category, cost:20};
    showToast('Reward added \u2728'); persist(); render();
  };
  actions['delete-reward'] = function(el){
    state.data.rewards = state.data.rewards.filter(function(r){ return r.id !== el.dataset.reward; });
    persist(); render();
  };

  actions['item-pts-inc'] = function(el){ var it = getItem(el.dataset.item); if(it){ it.points = clamp(it.points+1,1,100); persist(); render(); } };
  actions['item-pts-dec'] = function(el){ var it = getItem(el.dataset.item); if(it){ it.points = clamp(it.points-1,1,100); persist(); render(); } };
  actions['delete-item'] = function(el){
    state.data.dailyItems = state.data.dailyItems.filter(function(it){ return it.id !== el.dataset.item; });
    showToast('Activity removed'); persist(); render();
  };
  actions['newitem-pick-section'] = function(el){ ensureNewItemUi(); state.ui.newItem.section = el.dataset.section; render(); };
  actions['newitem-set-scope'] = function(el){ ensureNewItemUi(); state.ui.newItem.scope = el.dataset.scope; render(); };
  actions['newitem-pts-inc'] = function(){ ensureNewItemUi(); state.ui.newItem.points = clamp(state.ui.newItem.points+1,1,100); render(); };
  actions['newitem-pts-dec'] = function(){ ensureNewItemUi(); state.ui.newItem.points = clamp(state.ui.newItem.points-1,1,100); render(); };
  actions['add-activity'] = function(){
    ensureNewItemUi();
    var labelEl = document.getElementById('newItemLabelInput');
    var iconEl = document.getElementById('newItemIconInput');
    var label = labelEl && labelEl.value.trim();
    if(!label){ showToast('Type an activity name first','error'); return; }
    var icon = (iconEl && iconEl.value.trim()) || '\u2728';
    var ni = state.ui.newItem;
    state.data.dailyItems.push({id: uid('item'), section: ni.section, label: label, icon: icon, points: ni.points, scope: ni.scope==='all'?'all':'kids'});
    state.ui.newItem = {label:'', icon:'', section: ni.section, points:5, scope: ni.scope};
    showToast('Activity added \u2728'); persist(); render();
  };

  actions['adjust-pick-person'] = function(el){ ensureAdjustUi(); state.ui.adjust.personId = el.dataset.person; render(); };
  actions['adjust-set-mode'] = function(el){ ensureAdjustUi(); state.ui.adjust.mode = el.dataset.mode; render(); };
  actions['adjust-pts-inc'] = function(){ ensureAdjustUi(); state.ui.adjust.points = clamp(state.ui.adjust.points+1,1,200); render(); };
  actions['adjust-pts-dec'] = function(){ ensureAdjustUi(); state.ui.adjust.points = clamp(state.ui.adjust.points-1,1,200); render(); };
  actions['adjust-submit'] = function(){
    ensureAdjustUi();
    var a = state.ui.adjust;
    var p = getPerson(a.personId);
    if(!p){ showToast('Pick someone first','error'); return; }
    var inputEl = document.getElementById('adjustLabelInput');
    var label = (inputEl && inputEl.value.trim()) || a.label || (a.mode==='give' ? 'Bonus' : 'Correction');
    var pts = a.points || 1;
    if(a.mode==='give'){
      earn(p, pts, 'bonus');
      addHistory({personId:p.id, kind:'bonus', category:'bonus', label:label, points:pts});
      showToast('+'+pts+' pts for '+p.name+' \u2014 '+label+' \uD83C\uDF89'); burstConfetti();
    } else {
      // Penalty: lowers spendable points and the star score, but the tree
      // (totalLifetime) never shrinks \u2014 it only ever grows.
      var taken = Math.min(pts, p.points);
      p.points -= taken;
      tally(p, -pts);
      addHistory({personId:p.id, kind:'bonus', category:'bonus', label:label+' (penalty)', points:-pts});
      showToast(pts+' pts removed from '+p.name);
    }
    state.ui.adjust.label = ''; persist(); render();
  };

  actions['member-save-name'] = function(el){
    var p = getPerson(el.dataset.person);
    var input = document.getElementById('nameInput_'+el.dataset.person);
    if(p && input && input.value.trim()){ p.name = input.value.trim(); showToast('Name updated'); persist(); render(); }
  };
  actions['member-set-avatar'] = function(el){ var p = getPerson(el.dataset.person); if(p){ p.avatar = el.dataset.avatar; persist(); render(); } };
  actions['member-set-accent'] = function(el){ var p = getPerson(el.dataset.person); if(p){ p.accent = el.dataset.accent; persist(); render(); } };
  actions['member-set-role'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    p.role = el.dataset.role;
    if(p.role==='kid' && !p.hero) p.hero = defaultHero();   // Members card will ask boy or girl
    persist(); render();
  };
  actions['add-member'] = function(el){
    var role = el.dataset.role === 'parent' ? 'parent' : 'kid';
    // for a kid, first ask boy or girl so the right hero picture is used
    if(role==='kid' && !el.dataset.gender){ state.modal = {type:'newKid'}; render(); return; }
    var used = state.data.people.map(function(p){ return p.accent; });
    var freeAccent = ACCENT_KEYS.filter(function(a){ return used.indexOf(a)===-1; })[0] || ACCENT_KEYS[state.data.people.length % ACCENT_KEYS.length];
    var usedAv = state.data.people.map(function(p){ return p.avatar; });
    var freeAvatar = AVATARS.filter(function(a){ return usedAv.indexOf(a)===-1; })[0] || AVATARS[state.data.people.length % AVATARS.length];
    var np = freshPerson(role==='parent' ? 'New Parent' : 'New Kid', freeAvatar, freeAccent, role);
    if(role==='kid'){
      var g = el.dataset.gender==='girl' ? 'girl' : 'boy';
      np.hero = defaultHero(g);
      var emb = HERO_EMBLEM_KEYS.filter(function(e){ return !state.data.people.some(function(o){ return o.hero && o.hero.emblem===e; }); })[0];
      if(emb) np.hero.emblem = emb;
    }
    state.data.people.push(np);
    state.modal = null;
    showToast('Added \u2014 rename them below'); persist(); render();
  };
  actions['member-hero'] = function(el){
    var p = getPerson(el.dataset.person);
    if(!p) return;
    if(!p.hero) p.hero = defaultHero();
    var f = el.dataset.field, v = el.dataset.value;
    if(f==='gender'){
      var wasDefault = !p.hero.title || p.hero.title==='The Garden Hero' || p.hero.title==='The Garden Heroine';
      p.hero.gender = v==='girl' ? 'girl' : 'boy';
      if(wasDefault) p.hero.title = defaultHero(p.hero.gender).title;
    }
    else if(f==='emblem' && HERO_EMBLEMS[v]) p.hero.emblem = v;
    else if(f==='cape' && CAPES[v]) p.hero.cape = v;
    else if(f==='skin') p.hero.skin = clamp(parseInt(v,10)||0, 0, SKINS.length-1);
    persist(); render();
  };
  actions['member-save-hero-title'] = function(el){
    var p = getPerson(el.dataset.person), input = document.getElementById('heroTitle_'+el.dataset.person);
    if(!p || !input) return;
    if(!p.hero) p.hero = defaultHero();
    p.hero.title = input.value.trim().slice(0, 30);
    showToast('Hero name saved \ud83e\uddb8'); persist(); render();
  };
  actions['ask-reset-person'] = function(el){ state.modal={type:'confirmResetPerson', personId:el.dataset.person}; render(); };
  actions['do-reset-person'] = function(el){
    var p = getPerson(el.dataset.person);
    if(p){
      p.points=0; p.totalLifetime=0; p.savings=0; p.charityGiven=0;
      ['prayers','azkar','charity','habits','bonus'].forEach(function(c){ p.lifetime[c]=0; });
      p.todayLog = {date: todayStr(), done:{}, pending:{}, perfectGiven:false};
      p.dayPts = {}; p.convertRequests = []; p.streak = {count:0, last:null}; p.starsWon = 0; p.goalId = null;
      state.data.history = state.data.history.filter(function(h){ return h.personId !== p.id; });
      state.data.owed = state.data.owed.filter(function(o){ return o.personId !== p.id; });
    }
    state.modal=null; showToast('Stats reset'); persist(); render();
  };
  actions['ask-remove-person'] = function(el){ state.modal={type:'confirmRemovePerson', personId:el.dataset.person}; render(); };
  actions['do-remove-person'] = function(el){
    if(state.data.people.length<=1){ state.modal=null; render(); return; }
    state.data.people = state.data.people.filter(function(p){ return p.id !== el.dataset.person; });
    state.data.history = state.data.history.filter(function(h){ return h.personId !== el.dataset.person; });
    state.data.owed = state.data.owed.filter(function(o){ return o.personId !== el.dataset.person; });
    state.modal=null; showToast('Member removed'); persist(); render();
  };

  actions['save-currency'] = function(){
    var el = document.getElementById('currencyInput');
    var v = el && el.value.trim();
    if(!v){ showToast('Enter a currency label','error'); return; }
    state.data.currency = v.slice(0,6);
    showToast('Currency updated'); persist(); render();
  };
  actions['save-pin'] = function(){
    var p1 = document.getElementById('newPin1'), p2 = document.getElementById('newPin2');
    var v1 = p1 && p1.value.trim(), v2 = p2 && p2.value.trim();
    if(!/^\d{4}$/.test(v1||'')){ showToast('PIN must be 4 digits','error'); return; }
    if(v1 !== v2){ showToast('PINs don\u2019t match','error'); return; }
    state.data.pin = v1; showToast('PIN updated'); persist(); render();
  };
  actions['ask-reset-all'] = function(){ state.modal={type:'confirmResetAll'}; render(); };
  actions['do-reset-all'] = function(){
    state.data = defaultData(); state.modal=null; state.parentUnlocked=false; state.route={name:'home'};
    showToast('Everything reset'); persist(); render();
  };

  /* ============ event delegation ============ */
  document.getElementById('app-root').addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var fn = actions[el.dataset.action];
    if(fn) fn(el, e);
  });

  /* ============ init (Firebase) ============ */
  function init(){
    document.getElementById('app').innerHTML = renderLoading();
    state.data = defaultData(); // shown briefly until the real data arrives
    if(typeof firebase === 'undefined' || !FIREBASE_CONFIG || FIREBASE_CONFIG.apiKey === 'PASTE_YOUR_API_KEY'){
      showFatalError('Firebase isn\u2019t set up yet in this file.');
      return;
    }
    try{
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      auth = firebase.auth();
    }catch(e){
      console.error(e);
      showFatalError('Could not start Firebase \u2014 check FIREBASE_CONFIG values.');
      return;
    }
    auth.onAuthStateChanged(function(user){
      if(user){ attachListener(); }
      else {
        auth.signInAnonymously().catch(function(e){
          console.error(e);
          showFatalError('Sign-in failed. Check that Anonymous sign-in is enabled in Firebase Authentication.');
        });
      }
    });
  }
  init();

})();
</script>
