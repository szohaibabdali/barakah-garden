<style>
  :root{
    --sky-1:#DCEEFF; --sky-2:#F5FFF0;
    --moss:#3F7D58; --moss-dark:#2C5A3F;
    --sun:#F5B93E; --coral:#F2735E; --berry:#8B3A62; --teal:#3F8A8C;
    --cream:#FFFBF2; --ink:#1F2E23; --ink-soft:#5B6B60; --line:#DCE9D6;
    --radius:20px; --shadow:0 10px 26px rgba(31,46,35,0.12);
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nunito',sans-serif;color:var(--ink);}
  #app-root{min-height:100vh;background:linear-gradient(180deg,var(--sky-1) 0%, var(--sky-2) 60%);padding:0 0 40px;position:relative;overflow-x:hidden;}
  .disp{font-family:'Baloo 2',sans-serif;}
  h1,h2,h3{margin:0;font-weight:700;}
  p{margin:0;}
  button{font-family:inherit;border:none;cursor:pointer;background:none;color:inherit;}
  button:focus-visible, input:focus-visible{outline:3px solid var(--berry);outline-offset:2px;}
  input{font-family:inherit;}

  .cloud-bg{position:absolute;top:0;left:0;right:0;height:220px;overflow:hidden;pointer-events:none;z-index:0;}
  .cloud-bg span{position:absolute;background:#fff;opacity:0.55;border-radius:50%;filter:blur(1px);}

  .screen{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 18px 10px;animation:fadeSlideIn .4s ease both;}
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .home-header{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .eyebrow{font-size:13px;color:var(--ink-soft);font-weight:700;margin-bottom:2px;}
  .home-header h1{font-size:30px;color:var(--moss-dark);}
  .header-btns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn-ghost{background:#fff;border:2px solid var(--line);padding:9px 13px;border-radius:14px;font-weight:700;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow);white-space:nowrap;transition:transform .15s ease;}
  .btn-ghost:active{transform:scale(0.96);}
  .section-title{font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px;}
  .section-title:first-of-type{margin-top:0;}
  .kid-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;}
  .kid-card{background:var(--cream);border-radius:24px;padding:16px 14px 18px;box-shadow:var(--shadow);text-align:center;border:3px solid transparent;transition:transform .18s ease,border-color .18s ease;position:relative;}
  .kid-card:hover{transform:translateY(-3px);border-color:var(--accent);}
  .kid-card:active{transform:scale(0.98);}
  .role-badge{position:absolute;top:10px;left:10px;background:#fff;border:1px solid var(--line);font-size:10px;font-weight:800;padding:3px 8px;border-radius:8px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .today-badge{position:absolute;top:10px;right:10px;background:var(--accent);color:#fff;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:8px;}
  .kid-card-tree{width:100%;height:110px;margin-bottom:0;}
  .kid-card-avatar{font-size:32px;line-height:1;margin-bottom:4px;}
  .kid-card h3{font-size:19px;color:var(--ink);margin-bottom:2px;}
  .kid-points{font-size:14px;color:var(--ink-soft);font-weight:700;margin-bottom:2px;}
  .kid-points span{color:var(--accent);font-family:'Baloo 2',sans-serif;font-size:18px;}
  .kid-stage{font-size:11.5px;color:var(--ink-soft);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}

  .kid-topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .btn-icon{background:#fff;border-radius:12px;width:40px;height:40px;box-shadow:var(--shadow);font-size:18px;flex-shrink:0;}
  .btn-icon:active{transform:scale(0.94);}
  .kid-topbar-name{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}
  .kid-avatar-sm{font-size:24px;}
  .kid-topbar-name h2{font-size:20px;color:var(--moss-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .kid-points-pill{background:var(--accent,var(--sun));color:#fff;font-weight:800;font-family:'Baloo 2',sans-serif;padding:8px 13px;border-radius:16px;font-size:14px;box-shadow:var(--shadow);white-space:nowrap;}

  .tabs{display:flex;gap:5px;background:#fff;padding:5px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:16px;overflow-x:auto;}
  .tab{flex:1;padding:10px 6px;border-radius:12px;font-weight:700;font-size:12.5px;color:var(--ink-soft);white-space:nowrap;transition:background .15s ease,color .15s ease;}
  .tab.active{background:var(--accent,var(--moss));color:#fff;}

  .garden-card{background:var(--cream);border-radius:24px;padding:18px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px;}
  .garden-tree-wrap{width:100%;max-width:220px;height:190px;margin:0 auto 4px;}
  .stage-label{font-size:16px;font-weight:700;color:var(--moss-dark);margin-bottom:2px;}
  .stage-progress-track{background:var(--line);height:9px;border-radius:6px;margin:8px auto 4px;max-width:280px;overflow:hidden;}
  .stage-progress-fill{background:linear-gradient(90deg,var(--sun),var(--coral));height:100%;border-radius:6px;transition:width .4s ease;}
  .stage-progress-note{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .today-note{font-size:13px;color:var(--moss-dark);font-weight:800;margin-top:8px;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px;}
  .chip{background:#fff;border:2px solid var(--line);border-radius:14px;padding:7px 11px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px;}
  .chip b{font-family:'Baloo 2',sans-serif;font-size:14px;color:var(--ink);}

  .check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:6px;}
  .check-item{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:8px;text-align:left;transition:transform .12s ease,background .15s ease,border-color .15s ease;}
  .check-item:active{transform:scale(0.96);}
  .check-item.done{background:#EAF6EC;border-color:var(--moss);}
  .check-item.pending{background:#FFF7E6;border-color:var(--sun);}
  .check-item.pending .check-pts{color:#B8860B;}
  .check-icon{font-size:19px;flex-shrink:0;}
  .check-label{flex:1;font-size:13px;font-weight:700;color:var(--ink);min-width:0;}
  .check-pts{font-family:'Baloo 2',sans-serif;font-size:13px;color:var(--ink-soft);flex-shrink:0;}
  .check-item.done .check-pts{color:var(--moss);font-size:16px;}

  .reward-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
  .reward-card{background:#fff;border-radius:18px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;border:2px solid var(--line);}
  .reward-icon{font-size:26px;}
  .reward-label{font-weight:700;font-size:14.5px;color:var(--ink);min-height:38px;}
  .reward-cost{font-family:'Baloo 2',sans-serif;color:var(--berry);font-size:16px;}
  .reward-btn{margin-top:4px;background:var(--moss);color:#fff;border-radius:12px;padding:9px;font-weight:800;font-size:13.5px;transition:transform .12s ease;}
  .reward-btn:active{transform:scale(0.95);}
  .reward-btn:disabled{background:#C9D4CB;color:#7C8B80;cursor:not-allowed;}
  .reward-need{font-size:11.5px;color:var(--coral);font-weight:700;}
  .reward-pay-row{display:flex;gap:6px;}
  .reward-pay-row .reward-btn{flex:1;font-size:12.5px;padding:9px 4px;}
  .reward-btn.cash{background:var(--teal);}
  .star-bonus-card{background:var(--cream);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:center;margin-bottom:14px;border:2px dashed var(--sun);}
  .star-bonus-card.claimed{border-style:solid;border-color:var(--moss);color:var(--moss-dark);font-weight:800;font-size:14px;}
  .star-bonus-btn{width:100%;background:linear-gradient(90deg,var(--sun),var(--coral));color:#fff;padding:14px;border-radius:14px;font-weight:800;font-size:15px;box-shadow:var(--shadow);animation:pulse 1.6s ease-in-out infinite;}
  .star-bonus-btn:disabled{background:#C9D4CB;color:#7C8B80;cursor:not-allowed;box-shadow:none;animation:none;}

  .money-card{background:var(--cream);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;gap:10px;}
  .money-stat{flex:1;text-align:center;}
  .money-label{display:block;font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px;}
  .money-val{font-size:21px;color:var(--moss-dark);}

  .empty-state{text-align:center;padding:26px 12px;color:var(--ink-soft);}
  .empty-state .em{font-size:32px;display:block;margin-bottom:8px;}

  .activity-list{display:flex;flex-direction:column;gap:8px;}
  .activity-row{background:#fff;border-radius:16px;padding:11px 13px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
  .activity-icon{font-size:19px;width:32px;height:32px;border-radius:10px;background:var(--sky-1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .activity-body{flex:1;min-width:0;}
  .activity-label{font-weight:700;font-size:13.5px;color:var(--ink);}
  .activity-meta{font-size:11.5px;color:var(--ink-soft);}
  .activity-pts{font-family:'Baloo 2',sans-serif;font-size:15px;font-weight:700;flex-shrink:0;}
  .activity-pts.pos{color:var(--moss);}
  .activity-pts.neg{color:var(--coral);}

  .lock-screen{display:flex;flex-direction:column;align-items:center;padding-top:50px;}
  .lock-back{position:absolute;top:20px;left:18px;}
  .lock-card{background:var(--cream);border-radius:24px;box-shadow:var(--shadow);padding:28px 24px;text-align:center;max-width:320px;width:100%;}
  .lock-card h2{font-size:23px;color:var(--moss-dark);margin-bottom:4px;}
  .lock-sub{font-size:14px;color:var(--ink-soft);margin-bottom:16px;}
  .pin-dots{display:flex;gap:12px;justify-content:center;margin-bottom:10px;}
  .pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--berry);}
  .pin-dot.filled{background:var(--berry);}
  .pin-error{color:var(--coral);font-weight:700;font-size:13px;margin-bottom:8px;animation:shake .3s ease;}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}75%{transform:translateX(6px);}}
  .pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
  .pin-key{background:#fff;border-radius:14px;padding:15px 0;font-size:18px;font-weight:800;box-shadow:var(--shadow);font-family:'Baloo 2',sans-serif;}
  .pin-key:active{transform:scale(0.94);}
  .lock-hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}

  .parent-screen{background:repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(63,125,88,0.06) 27px, rgba(63,125,88,0.06) 28px);}
  .parent-topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:10px;}
  .parent-topbar h2{font-size:20px;color:var(--moss-dark);}
  .parent-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
  .ptab{background:#fff;border:2px solid var(--line);padding:9px 13px;border-radius:12px;font-weight:700;font-size:12.5px;white-space:nowrap;box-shadow:var(--shadow);}
  .ptab.active{background:var(--berry);border-color:var(--berry);color:#fff;}

  .card{background:#fff;border-radius:18px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px;border:1px solid var(--line);}
  .field-label{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;}
  .seg-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .seg-btn{background:#fff;border:2px solid var(--line);padding:9px 13px;border-radius:12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px;}
  .seg-btn.active{border-color:var(--moss);background:var(--moss);color:#fff;}
  .text-input{width:100%;padding:12px 14px;border-radius:12px;border:2px solid var(--line);font-size:14.5px;margin-bottom:12px;}
  .stepper{display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:16px;}
  .stepper button{background:var(--cream);border:2px solid var(--line);width:40px;height:40px;border-radius:12px;font-size:19px;font-weight:800;}
  .stepper button:active{transform:scale(0.9);}
  .stepper .val{font-family:'Baloo 2',sans-serif;font-size:24px;min-width:52px;text-align:center;color:var(--berry);}
  .stepper.sm button{width:30px;height:30px;font-size:15px;border-radius:9px;}
  .stepper.sm .val{font-size:16px;min-width:34px;}
  .btn-primary{width:100%;background:var(--berry);color:#fff;padding:14px;border-radius:14px;font-weight:800;font-size:15px;box-shadow:var(--shadow);}
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{background:#fff;border:2px solid var(--line);color:var(--ink);padding:11px;border-radius:14px;font-weight:700;font-size:13.5px;}

  .list-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .grow{flex:1;min-width:0;}
  .list-row .name{font-weight:700;font-size:14px;}
  .list-row .sub{font-size:11.5px;color:var(--ink-soft);}
  .icon-btn{background:var(--cream);border-radius:10px;width:32px;height:32px;font-size:13px;flex-shrink:0;}
  .icon-btn:active{transform:scale(0.9);}

  .kid-edit-card{margin-bottom:14px;}
  .avatar-pick-row,.color-pick-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 4px;}
  .avatar-pick{font-size:19px;background:#fff;border:2px solid var(--line);width:38px;height:38px;border-radius:10px;}
  .avatar-pick.active{border-color:var(--berry);background:var(--sky-1);}
  .color-pick{width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);}
  .color-pick.active{box-shadow:0 0 0 3px var(--ink);}

  .toggle-row{display:flex;gap:8px;background:var(--sky-1);padding:4px;border-radius:14px;margin-bottom:16px;}
  .toggle-btn{flex:1;padding:10px;border-radius:11px;font-weight:800;font-size:13px;}
  .toggle-btn.active{background:#fff;box-shadow:var(--shadow);}

  .modal-overlay{position:fixed;inset:0;background:rgba(31,46,35,0.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50;animation:fadeIn .2s ease both;}
  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .modal-card{background:#fff;border-radius:20px;padding:22px;max-width:340px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,0.25);}
  .modal-card h3{font-size:18px;color:var(--moss-dark);margin-bottom:8px;}
  .modal-card p{font-size:13.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:16px;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions .btn-ghost, .modal-actions .btn-primary{flex:1;text-align:center;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:13px 20px;border-radius:14px;font-weight:700;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,0.3);z-index:60;animation:toastIn .25s ease both;max-width:90vw;text-align:center;}
  .toast.error{background:var(--coral);}
  @keyframes toastIn{from{opacity:0;transform:translate(-50%,10px);}to{opacity:1;transform:translate(-50%,0);}}

  .confetti-layer{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden;}
  .confetti-piece{position:absolute;top:-20px;font-size:20px;animation:confettiFall 1.1s ease-in forwards;}
  @keyframes confettiFall{to{transform:translateY(100vh) rotate(360deg);opacity:0.2;}}

  .loading-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:10px;}
  .loading-screen .em{font-size:40px;animation:pulse 1.2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.15);}}

  .note-box{background:var(--sky-1);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:14px;}

  /* ===== v9 layout: bottom tabs, hero profile, journey, shop ===== */
  #app-root{padding-bottom:110px;}
  .toast{bottom:96px;pointer-events:none;}
  .hero{display:block;border-radius:50%;flex-shrink:0;}
  .emoji-face{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--cream);}
  .new{display:inline-block;background:var(--berry);color:#fff;font-size:9px;font-weight:800;border-radius:6px;padding:1px 5px;vertical-align:middle;letter-spacing:.03em;}

  .tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:760px;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
    background:#fff;border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(31,46,35,0.08);padding:6px 8px calc(10px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;}
  .tabbtn{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:800;color:var(--ink-soft);position:relative;}
  .tabbtn .ic{font-size:22px;line-height:1.1;filter:grayscale(0.6);opacity:.75;transition:transform .15s ease;}
  .tabbtn.active{color:var(--accent);}
  .tabbtn.active .ic{filter:none;opacity:1;transform:translateY(-2px) scale(1.12);}
  .tabbtn .dot{position:absolute;top:2px;left:calc(50% + 6px);background:var(--coral);color:#fff;font-size:10px;border-radius:8px;padding:0 5px;line-height:16px;}

  .home-header h1{font-size:28px;}
  .star-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px;}
  .star{border-radius:20px;padding:10px 8px 12px;text-align:center;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;}
  .star.week{background:#FFF6DF;border:2px solid var(--sun);}
  .star.day{background:#FFF0EB;border:2px solid var(--coral);}
  .star .t{font-size:10.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em;}
  .star .w{font-size:34px;line-height:1.3;}
  .star .n{font-family:'Baloo 2',sans-serif;font-size:16px;line-height:1.1;font-weight:700;}
  .star .p{font-size:11px;font-weight:700;color:var(--ink-soft);}
  .star-faces{display:flex;gap:4px;justify-content:center;}
  .board{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 2px;}
  .board span{background:#fff;border:1px solid var(--line);border-radius:12px;padding:4px 9px;font-size:12px;font-weight:700;}
  .board b{font-family:'Baloo 2',sans-serif;}
  .month-line{text-align:center;font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:6px;}
  .player{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:10px 12px;box-shadow:var(--shadow);margin-bottom:8px;border-left:6px solid var(--k);width:100%;text-align:left;}
  .player .m{flex:1;min-width:0;}
  .player .nm{font-family:'Baloo 2',sans-serif;font-size:18px;line-height:1.1;display:block;font-weight:700;}
  .player .sb{font-size:11.5px;font-weight:700;color:var(--ink-soft);display:block;}
  .player .r{text-align:right;flex-shrink:0;}

<script>
(function(){
  "use strict";

  /* ============ constants ============ */
  var AVATARS = ['🦊','🐼','🐸','🐧','🦉','🐢','🦁','🐰','🐨','🐯','🦇','🕷️','🦸‍♀️','🦸‍♂️','🛡️','⚡'];
  var ACCENTS = {coral:'#F2735E', moss:'#3F7D58', sun:'#F5B93E', berry:'#8B3A62', teal:'#3F8A8C', sky:'#4E85B0', plum:'#7B5C82', clay:'#C97B4A', navy:'#34558B', crimson:'#C8452F'};
  var ACCENT_KEYS = Object.keys(ACCENTS);

  var SECTION_META = {
    prayers: {title:'Salah',        icon:'🕌'},
    azkar:   {title:'Azkar',        icon:'📿'},
    charity: {title:'Charity',      icon:'🤲'},
    habits:  {title:'Daily Habits', icon:'🌱'},
    bonus:   {title:'Bonus',        icon:'⭐'}
  };
  var SECTION_ORDER = ['prayers','azkar','charity','habits'];

  var DEFAULT_DAILY_ITEMS = [
    {id:'fajr',    section:'prayers', label:'Fajr',    icon:'🌅', points:5},
    {id:'dhuhr',   section:'prayers', label:'Dhuhr',   icon:'☀️', points:5},
    {id:'asr',     section:'prayers', label:'Asr',     icon:'🌤️', points:5},
    {id:'maghrib', section:'prayers', label:'Maghrib', icon:'🌇', points:5},
    {id:'isha',    section:'prayers', label:'Isha',    icon:'🌙', points:5},
    {id:'azkar_morning', section:'azkar', label:'Morning Azkar', icon:'📿', points:5},
    {id:'azkar_evening', section:'azkar', label:'Evening Azkar', icon:'📿', points:5},
    {id:'charity_today', section:'charity', label:'Gave Charity', icon:'🤲', points:10},
    {id:'brush_am', section:'habits', label:'Brush Teeth (AM)', icon:'🪥', points:3},
    {id:'brush_pm', section:'habits', label:'Brush Teeth (PM)', icon:'🪥', points:3},
    {id:'chores',   section:'habits', label:'Home Chores',      icon:'🧹', points:8},
    {id:'studies',  section:'habits', label:'Studies',          icon:'📚', points:10},
    {id:'other_good', section:'habits', label:'Other Good Deed', icon:'✨', points:5}
  ];

  var REWARD_CATS = {
    screen:   {label:'Screen Time',     icon:'📺'},
    treat:    {label:'Treats & Toys',   icon:'🍭'},
    activity: {label:'Family Activity', icon:'🎉'},
    custom:   {label:'Special',         icon:'✨'},
    big:      {label:'Big Rewards',     icon:'🏆'}
  };
  var REWARD_CAT_ORDER = ['screen','treat','activity','custom','big'];

  // Extra rewards added to existing families once (see migrateData)
  var REWARD_PACK_V2 = [
    {id:'r11', label:'1 hour gaming session', cost:60, category:'screen'},
    {id:'r12', label:'Pick dinner or dessert', cost:75, category:'treat'},
    {id:'r13', label:'Buy your favourite book', cost:150, category:'treat'},
    {id:'r14', label:'Favourite restaurant meal', cost:200, category:'treat'},
    {id:'r15', label:'Art & craft kit', cost:250, category:'treat'},
    {id:'r16', label:'Friend sleepover', cost:300, category:'activity'},
    {id:'r17', label:'Trampoline park / play zone trip', cost:400, category:'activity'},
    {id:'r18', label:'Theme park day', cost:1000, category:'activity'},
    {id:'r19', label:'Stay up 1 hour later (weekend)', cost:100, category:'custom'},
    {id:'r20', label:'Boss of the Day — choose the family plan', cost:120, category:'custom'},
    {id:'r21', label:'New outfit or shoes', cost:500, category:'big'},
    {id:'r22', label:'New video game', cost:750, category:'big'},
    {id:'r23', label:'LEGO set', cost:1000, category:'big'},
    {id:'r24', label:'Bike or scooter', cost:1500, category:'big'},
    {id:'r25', label:'PlayStation', cost:2000, category:'big'},
    {id:'r26', label:'Tablet', cost:1800, category:'big'}
  ];
  var HISTORY_CAP = 1500;
  var MIN_CONVERT = 100;
  var DEFAULT_PTS_PER_CURRENCY = 1;   // 1 point = 1 QAR

  var DEFAULT_REWARDS = [
    {id:'r1', label:'30 min extra screen time', cost:20, category:'screen'},
    {id:'r2', label:'1 hour screen time', cost:35, category:'screen'},
    {id:'r3', label:'Pick a treat', cost:15, category:'treat'},
    {id:'r4', label:'Small toy', cost:50, category:'treat'},
    {id:'r5', label:'Ice cream trip', cost:40, category:'treat'},
    {id:'r6', label:'Pick family movie night', cost:25, category:'activity'},
    {id:'r7', label:'Trip to the park', cost:30, category:'activity'},
    {id:'r8', label:'Friend playdate', cost:35, category:'activity'},
    {id:'r9', label:'Stay up 15 min later', cost:20, category:'custom'},
    {id:'r10', label:'Skip one chore', cost:25, category:'custom'}
  ];

  var STAGE_LABELS = ['Seed','Sprout','Sapling','Young Tree','Full Tree','Blooming Tree'];
  var STAGE_THRESHOLDS = [0,50,150,400,900,1800];
  var PERFECT_DAY_BONUS = 15;
  var db = null, auth = null, docRef = null;

  /* ============ helpers ============ */
  function uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9); }
  function escapeHtml(str){
    return String(str==null?'':str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function clamp(n,min,max){ return Math.max(min, Math.min(max, n)); }
  function hashSeed(str){
    var h = 0; str = String(str);
    for(var i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) % 100000; }
    return h + 1;
  }
  function getGreeting(){
    var hr = new Date().getHours();
    if(hr < 5 || hr >= 21) return 'Good night';
    if(hr < 12) return 'Good morning';
    if(hr < 18) return 'Good afternoon';
    return 'Good evening';
  }
  function todayStr(){ return dateKey(Date.now()); }
  function dateKey(ts){
    var d = new Date(ts);
    var m = String(d.getMonth()+1); if(m.length<2) m='0'+m;
    var day = String(d.getDate()); if(day.length<2) day='0'+day;
    return d.getFullYear()+'-'+m+'-'+day;
  }
  function stageForTotal(total){
    var s = 0;
    for(var i=0;i<STAGE_THRESHOLDS.length;i++){ if(total >= STAGE_THRESHOLDS[i]) s = i; }
    return s;
  }
  function stageProgress(total){
    var s = stageForTotal(total);
    var cur = STAGE_THRESHOLDS[s];
    var next = STAGE_THRESHOLDS[s+1];
    if(next == null) return {pct:100, note:'Fully grown \u2014 amazing work!'};
    var pct = clamp(((total-cur)/(next-cur))*100, 0, 100);
    return {pct: pct, note: (next-total) + ' pts to next growth stage'};
  }
  function timeAgo(ts){
    var diff = Date.now() - ts;
    var mins = Math.floor(diff/60000);
    if(mins < 1) return 'just now';
    if(mins < 60) return mins + 'm ago';
    var hrs = Math.floor(mins/60);
    if(hrs < 24) return hrs + 'h ago';
    var days = Math.floor(hrs/24);
    if(days < 7) return days + 'd ago';
    return new Date(ts).toLocaleDateString();
  }
  function fmtMoney(n){
    var v = (typeof n==='number' && !isNaN(n)) ? n : 0;
    return v.toFixed(2).replace(/\.00$/,'');
  }

  /* ============ data model ============ */
  function freshPerson(name, avatar, accent, role){
    return {
      id: uid('p'),
      name: name,
      avatar: avatar,
      accent: accent,
      role: role,
      points: 0,
      lifetime: {prayers:0, azkar:0, charity:0, habits:0, bonus:0},
      totalLifetime: 0,
      todayLog: {date: todayStr(), done:{}, pending:{}, perfectGiven:false},
      savings: 0,
      charityGiven: 0,
      dayPts: {},          // { 'YYYY-MM-DD': points earned that day } — drives Daily/Weekly/Monthly stars
      convertRequests: [], // points→money requests waiting for a parent
      streak: {count:0, last:null},  // Perfect Days in a row
      starsWon: 0,         // Star of the Week trophies
      goalId: null         // reward they're saving for (defaults to the top reward)
    };
  }
  function defaultData(){
    var d = {
      pin: '1234',
      currency: 'QAR',
      people: [
        freshPerson('ABBA', '🦉', 'berry', 'parent'),
        freshPerson('Mimi', '🐨', 'teal', 'parent'),
        freshPerson('Maazin', '🦇', 'coral', 'kid'),
        freshPerson('Musa', '🕷️', 'moss', 'kid'),
        freshPerson('Zohrah', '🦸\u200d♀️', 'plum', 'kid')
      ],
      dailyItems: DEFAULT_DAILY_ITEMS.map(function(it){ return Object.assign({}, it); }),
      rewards: DEFAULT_REWARDS.concat(REWARD_PACK_V2).map(function(r){ return Object.assign({}, r); }),
      rewardPackV2: true,
      tallyV1: true,
      psTopV1: true,
      rateOneV1: true,
      pointsPerCurrency: DEFAULT_PTS_PER_CURRENCY,
      owed: [],            // rewards redeemed that a parent still needs to hand over
      history: []
    };
    applyHeroPresets(d);
    return d;
  }
  function migrateData(data){
    var d = data && typeof data === 'object' ? data : {};
    if(!d.pin || !/^\d{4}$/.test(d.pin)) d.pin = '1234';
    if(!d.currency || typeof d.currency !== 'string') d.currency = 'QAR';
    if(!Array.isArray(d.people) || d.people.length===0) d.people = defaultData().people;
    d.people.forEach(function(p){
      if(!p.id) p.id = uid('p');
      if(!p.name) p.name = 'Family Member';
      if(!p.avatar) p.avatar = '🦊';
      if(!p.accent || !ACCENTS[p.accent]) p.accent = 'coral';
      if(p.role !== 'parent' && p.role !== 'kid') p.role = 'kid';
      if(typeof p.points !== 'number' || isNaN(p.points)) p.points = 0;
      if(!p.lifetime || typeof p.lifetime !== 'object') p.lifetime = {};
      ['prayers','azkar','charity','habits','bonus'].forEach(function(c){ if(typeof p.lifetime[c] !== 'number') p.lifetime[c] = 0; });
      if(typeof p.totalLifetime !== 'number' || isNaN(p.totalLifetime)) p.totalLifetime = 0;
      if(!p.todayLog || typeof p.todayLog !== 'object') p.todayLog = {date: todayStr(), done:{}, pending:{}, perfectGiven:false};
      if(!p.todayLog.done || typeof p.todayLog.done !== 'object') p.todayLog.done = {};
      if(!p.todayLog.pending || typeof p.todayLog.pending !== 'object') p.todayLog.pending = {};
      if(typeof p.savings !== 'number' || isNaN(p.savings)) p.savings = 0;
      if(typeof p.charityGiven !== 'number' || isNaN(p.charityGiven)) p.charityGiven = 0;
      if(!p.dayPts || typeof p.dayPts !== 'object') p.dayPts = {};
      if(!Array.isArray(p.convertRequests)) p.convertRequests = [];
      if(!p.streak || typeof p.streak !== 'object') p.streak = {count:0, last:null};
      if(typeof p.starsWon !== 'number' || isNaN(p.starsWon)) p.starsWon = 0;
      if(p.goalId === undefined) p.goalId = null;
      if(p.hero){
        if(p.hero.gender !== 'boy' && p.hero.gender !== 'girl') p.hero.gender = null;
        if(!HERO_EMBLEMS[p.hero.emblem]) p.hero.emblem = 'star';
        if(!CAPES[p.hero.cape]) p.hero.cape = 'gold';
        if(typeof p.hero.skin !== 'number' || !SKINS[p.hero.skin]) p.hero.skin = 1;
        if(typeof p.hero.title !== 'string') p.hero.title = '';
      }
    });
    applyHeroPresets(d);   // one-time: hero looks for kids who don't have one yet
    if(!Array.isArray(d.history)) d.history = [];
    if(!d.tallyV1){
      // one-time upgrade: rebuild each kid's daily tally from whatever history is still kept
      d.history.forEach(function(h){
        if(h.kind!=='daily' && h.kind!=='bonus') return;
        var p = d.people.filter(function(x){ return x.id===h.personId; })[0];
        if(!p || p.role!=='kid' || !h.points) return;
        var k = dateKey(h.ts);
        p.dayPts[k] = (p.dayPts[k]||0) + h.points;
      });
      d.tallyV1 = true;
    }
    if(!Array.isArray(d.owed)) d.owed = [];
    if(!Array.isArray(d.dailyItems) || d.dailyItems.length===0) d.dailyItems = defaultData().dailyItems;
    d.dailyItems.forEach(function(it){
      if(!it.id) it.id = uid('item');
      if(!it.section || !SECTION_META[it.section]) it.section = 'habits';
      if(typeof it.points !== 'number' || isNaN(it.points)) it.points = 5;
      if(!it.label) it.label = 'Task';
      if(!it.icon) it.icon = '\u2728';
      if(it.scope !== 'kids') it.scope = 'all';
    });
    if(!Array.isArray(d.rewards) || d.rewards.length===0) d.rewards = defaultData().rewards;
    if(!d.rewardPackV2){
      // one-time upgrade: add the new reward ideas to an existing family
      var haveLabels = d.rewards.map(function(r){ return String(r.label||'').toLowerCase(); });
      var haveIds = d.rewards.map(function(r){ return r.id; });
      REWARD_PACK_V2.forEach(function(r){
        if(haveLabels.indexOf(r.label.toLowerCase())!==-1) return;
        var copy = Object.assign({}, r);
        if(haveIds.indexOf(copy.id)!==-1) copy.id = uid('rw');
        d.rewards.push(copy);
      });
      d.rewardPackV2 = true;
    }
    d.rewards.forEach(function(r){
      if(!r.id) r.id = uid('rw');
      if(!r.category || !REWARD_CATS[r.category]) r.category = 'custom';
      if(typeof r.cost !== 'number' || isNaN(r.cost)) r.cost = 10;
      if(r.cashPrice != null && (typeof r.cashPrice !== 'number' || isNaN(r.cashPrice) || r.cashPrice <= 0)) delete r.cashPrice;
    });
    if(!d.rateOneV1){
      // one-time: switch the family to 1 point = 1 QAR (parents can change it later in Settings)
      d.pointsPerCurrency = 1;
      d.rateOneV1 = true;
    }
    if(!d.psTopV1){
      // one-time: keep the PlayStation as the highest reward (the old default Tablet was 2,500)
      d.rewards.forEach(function(r){ if(r.label==='Tablet' && r.cost===2500) r.cost = 1800; });
      d.psTopV1 = true;
    }
    if(typeof d.pointsPerCurrency !== 'number' || isNaN(d.pointsPerCurrency) || d.pointsPerCurrency < 1) d.pointsPerCurrency = DEFAULT_PTS_PER_CURRENCY;
    if(!Array.isArray(d.history)) d.history = [];
    return d;
  }

  /* ============ state ============ */
  var state = { data:null, route:{name:'home'}, parentUnlocked:false, ui:{}, modal:null, toast:null, confetti:false };
  var toastTimer = null, confettiTimer = null;

  function getPerson(id){ return state.data.people.filter(function(p){ return p.id===id; })[0]; }
  function getReward(id){ return state.data.rewards.filter(function(r){ return r.id===id; })[0]; }
  function getItem(id){ return state.data.dailyItems.filter(function(it){ return it.id===id; })[0]; }
  function todayLogFor(p){
    var today = todayStr();
    if(!p.todayLog || p.todayLog.date !== today){ p.todayLog = {date:today, done:{}, pending:{}, perfectGiven:false}; }
    return p.todayLog;
  }
  function ptsLabel(n){ return n===1 ? '1 point' : n+' pts'; }
  function pointsToCash(pts){ return Math.round((pts / state.data.pointsPerCurrency) * 100) / 100; }
  // A reward's cash price: the parent-set price if there is one, otherwise
  // the points cost converted at the family's points-to-cash rate.
  function cashPriceFor(r){ return (typeof r.cashPrice === 'number' && r.cashPrice > 0) ? r.cashPrice : pointsToCash(r.cost); }
  function allTasksDone(p){
    var log = todayLogFor(p);
    var items = visibleItemsFor(p);
    return items.length > 0 && items.every(function(it){ return !!log.done[it.id]; });
  }
  function addHistory(entry){
    entry.id = uid('h'); entry.ts = Date.now();
    state.data.history.unshift(entry);
    if(state.data.history.length > HISTORY_CAP) state.data.history.length = HISTORY_CAP;
  }
  // Every earned / removed point for a kid goes through here so the
  // star rankings (kept in p.dayPts) can never drift from history.
  function tally(p, pts){
    if(p.role !== 'kid' || !pts) return;
    var k = todayStr();
    p.dayPts[k] = (p.dayPts[k]||0) + pts;
    // keep ~100 days of tallies so the data doc stays small
    var keys = Object.keys(p.dayPts).sort();
    while(keys.length > 100){ delete p.dayPts[keys.shift()]; }
  }
  function earn(p, pts, section){
    p.points += pts;
    p.lifetime[section] = (p.lifetime[section]||0) + pts;
    p.totalLifetime += pts;
    tally(p, pts);
  }
  function unearn(p, pts, section){
    p.points = clamp(p.points - pts, 0, 9999999);
    p.lifetime[section] = clamp((p.lifetime[section]||0) - pts, 0, 9999999);
    p.totalLifetime = clamp(p.totalLifetime - pts, 0, 9999999);
    tally(p, -pts);
  }
  function pendingConvertPts(p){ return (p.convertRequests||[]).reduce(function(s,r){ return s + r.pts; }, 0); }
  function spendablePoints(p){ return Math.max(0, p.points - pendingConvertPts(p)); }

  /* ============ storage (YOUR Firebase project, live-synced) ============ */
  var suppressNextEcho = false;

  async function persist(){
    if(!docRef) return;
    try{
      suppressNextEcho = true;
      await docRef.set({ json: JSON.stringify(state.data), updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
    }catch(e){
      console.error('save failed', e);
      showToast('Could not save \u2014 check your connection', 'error');
    }
  }

  function attachListener(){
    docRef = db.collection('families').doc(FAMILY_ID);
    docRef.onSnapshot(function(snap){
      if(!snap.exists){
        // first time anyone has opened this family's data — create it
        state.data = defaultData();
        awardFinishedWeeks();
        render();
        persist();
        return;
      }
      var raw = snap.data() && snap.data().json;
      if(!raw) return;
      state.data = migrateData(JSON.parse(raw));
      // hand out Star of the Week trophies for any week that has finished
      if(awardFinishedWeeks()) persist();
      // if this update is just the echo of our own write, or the person is
      // mid-typing, update the data quietly without yanking the screen
      var ae = document.activeElement;
      var typing = ae && (ae.tagName==='INPUT' || ae.tagName==='TEXTAREA');
      if(suppressNextEcho){ suppressNextEcho = false; if(typing) return; }
      if(typing) return;
      render();
    }, function(err){
      console.error(err);
      showFatalError('Could not connect to your Firebase database. Check that Firestore is enabled and your security rules allow signed-in access.');
    });
  }

  function manualRefresh(){
    if(!docRef){ return; }
    docRef.get({source:'server'}).then(function(snap){
      if(snap.exists && snap.data().json){ state.data = migrateData(JSON.parse(snap.data().json)); render(); showToast('Up to date \u2705'); }
    }).catch(function(e){ console.error(e); showToast('Refresh failed','error'); });
  }

  function showFatalError(msg){
    document.getElementById('app').innerHTML =
      '<div class="loading-screen"><span class="em">\u26A0\uFE0F</span>'+
      '<p class="disp" style="font-size:18px;color:var(--coral);max-width:320px;text-align:center;">'+escapeHtml(msg)+'</p>'+
      '<p style="font-size:13px;color:var(--ink-soft);margin-top:8px;max-width:320px;text-align:center;">Double-check FIREBASE_CONFIG at the top of this file, that Firestore + Anonymous sign-in are turned on, and that your security rules were published. Then reload this page.</p></div>';
  }

  /* ============ tree svg ============ */
  function treeSVG(stage, accentHex, seed){
    var cx = 80, groundY = 138;
    var trunkH = [6,18,34,52,66,74][stage];
    var trunkW = [10,10,12,14,16,18][stage];
    var canopyR = [0,0,20,28,34,40][stage];
    var canopyY = groundY - trunkH - canopyR*0.6;
    var canopy = '';
    if(canopyR > 0){
      var offs = [[-canopyR*0.5,4,canopyR*0.72],[canopyR*0.5,4,canopyR*0.72],[0,-canopyR*0.35,canopyR*0.85]];
      canopy = offs.map(function(o){
        return '<circle cx="'+(cx+o[0]).toFixed(1)+'" cy="'+(canopyY+o[1]).toFixed(1)+'" r="'+o[2].toFixed(1)+'" fill="#3F7D58" opacity="0.92"/>';
      }).join('');
    }
    var blossomCount = [0,0,0,3,6,10][stage];
    var blossoms = '';
    var s = seed || 1;
    function rnd(){ s = (s*9301+49297) % 233280; return s/233280; }
    var palette = [accentHex, '#F5B93E', '#FFFFFF'];
    for(var i=0;i<blossomCount;i++){
      var ang = rnd()*Math.PI*2;
      var rad = rnd()*canopyR*0.75;
      var bx = cx + Math.cos(ang)*rad;
      var by = canopyY + Math.sin(ang)*rad*0.8;
      blossoms += '<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="3.4" fill="'+palette[i%3]+'"/>';
    }
    var trunk = stage===0
      ? '<circle cx="80" cy="132" r="5" fill="#8B5E3C"/>'
      : '<rect x="'+(cx-trunkW/2).toFixed(1)+'" y="'+(groundY-trunkH)+'" width="'+trunkW+'" height="'+trunkH+'" rx="4" fill="#8B5E3C"/>';
    return '<svg viewBox="0 0 160 150" width="100%" height="100%" role="img" aria-label="'+STAGE_LABELS[stage]+'">'+
      '<ellipse cx="80" cy="142" rx="54" ry="8" fill="#3F7D58" opacity="0.18"/>'+ trunk + canopy + blossoms + '</svg>';
  }

  function shade(hex, amt){
    var n = parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    function f(c){ return Math.round(c*(1-amt)); }
    return '#'+[f(r),f(g),f(b)].map(function(c){ var s=c.toString(16); return s.length<2?'0'+s:s; }).join('');
  }
  var heroSeq = 0;
  function heroSVG(p, size){

    return '<svg class="hero" width="'+size+'" height="'+size+'" viewBox="0 0 120 120" role="img" aria-label="'+escapeHtml(p.name)+'">'+

        '<path d="M37 44 Q38 20 60 20 Q82 20 83 44 Q76 32 60 31 Q44 32 37 44 Z" fill="'+hair+'"/>'+ band +
        '<path d="M36 44 Q48 36 60 43 Q72 36 84 44 Q82 54 72 53 Q64 52 60 48 Q56 52 48 53 Q38 54 36 44 Z" fill="'+mask+'"/>'+

        '<circle cx="51" cy="46.5" r="2" fill="#1F2E23"/><circle cx="71" cy="46.5" r="2" fill="#1F2E23"/>'+
        '<path d="M52 57 Q60 63 68 57" stroke="#7A3E2B" stroke-width="2.6" fill="none" stroke-linecap="round"/>'+

  /* ============ journey (never-ending, based on lifetime growth) ============ */
  var BASE_LANDS = [
    {n:'Seed Valley',      p:0,    i:'🌱'},
    {n:'Sprout Meadow',    p:50,   i:'🌿'},
    {n:'Sapling Woods',    p:150,  i:'🌳'},
    {n:'Young Tree Hills', p:400,  i:'⛰️'},
    {n:'Full Tree Forest', p:900,  i:'🌲'},
    {n:'Blooming Garden',  p:1800, i:'🌸'},
    {n:'Golden Oasis',     p:3000, i:'🌴'},
    {n:'Crescent Peaks',   p:4500, i:'🌙'},
    {n:'Starlight Kingdom',p:6500, i:'✨'}
  ];
  function land(i){
    if(i < BASE_LANDS.length) return BASE_LANDS[i];
    var n = i - BASE_LANDS.length + 2;
    return {n:'Barakah Summit '+n, p:6500 + 2500*(n-1), i:'🏔️'};
  }
  function landIndex(life){ var i = 0; while(land(i+1).p <= life) i++; return i; }

  /* ============ streak + stars won ============ */
  function addDaysKey(key, n){ var a = key.split('-'); return dateKey(new Date(+a[0], +a[1]-1, +a[2]+n).getTime()); }
  function yesterdayKey(){ return addDaysKey(todayStr(), -1); }
  function streakOf(p){
    var s = p.streak || {};
    if(!s.last) return 0;
    return (s.last===todayStr() || s.last===yesterdayKey()) ? (s.count||0) : 0;
  }
  function bumpStreak(p){
    var s = p.streak, t = todayStr();
    if(s.last === t) return;
    s.prevLast = s.last || null; s.prevCount = s.count || 0;
    s.count = (s.last === yesterdayKey()) ? (s.count||0) + 1 : 1;
    s.last = t;
  }
  function undoStreak(p){
    var s = p.streak;
    if(s.last !== todayStr()) return;
    s.last = s.prevLast || null; s.count = s.prevCount || 0;
  }
  // Each finished Sun–Sat week, the top kid(s) get a Star of the Week trophy.
  // Starts counting from the week this version was first opened.
  function awardFinishedWeeks(){
    var d = state.data, cur = weekStartKey(), changed = false;
    if(!d.lastStarWeek){ d.lastStarWeek = cur; return true; }
    var guard = 0;
    while(d.lastStarWeek < cur && guard++ < 60){
      var start = d.lastStarWeek, end = addDaysKey(start, 7);
      var rows = d.people.filter(function(p){ return p.role==='kid'; }).map(function(p){
        var t = Object.keys(p.dayPts||{}).reduce(function(s,k){ return (k>=start && k<end) ? s + p.dayPts[k] : s; }, 0);
        return {p:p, t:t};
      });
      var top = rows.reduce(function(m,r){ return Math.max(m, r.t); }, 0);
      if(top > 0){
        rows.filter(function(r){ return r.t===top; }).forEach(function(r){
          r.p.starsWon = (r.p.starsWon||0) + 1;
          addHistory({personId:r.p.id, kind:'bonus', category:'bonus', label:'🏆 Star of the Week ('+top+' pts)', points:0});
        });
      }
      d.lastStarWeek = end; changed = true;
    }
    return changed;
  }

  /* ============ rankings (from each kid's daily tally) ============ */
  // Week = Sunday to Saturday; month = calendar month; day = today.
  function weekStartKey(){ var d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - d.getDay()); return dateKey(d.getTime()); }
  function weekEndLabel(){ var d = new Date(); d.setDate(d.getDate() + (6 - d.getDay())); return d.toLocaleDateString(undefined,{weekday:'short', day:'numeric', month:'short'}); }
  function monthStartKey(){ var d = new Date(); d.setHours(0,0,0,0); d.setDate(1); return dateKey(d.getTime()); }
  function computeRankedFrom(startKey){
    var kids = state.data.people.filter(function(p){ return p.role==='kid'; });
    var rows = kids.map(function(p){
      var total = Object.keys(p.dayPts||{}).reduce(function(sum, k){ return k >= startKey ? sum + (p.dayPts[k]||0) : sum; }, 0);
      return {person:p, total: total};
    });
    rows.sort(function(a,b){ return b.total - a.total; });
    return rows;
  }

  function renderQuests(p){
    var log = todayLogFor(p), items = visibleItemsFor(p);
    var done = items.filter(function(it){ return log.done[it.id]; }).length;
    var pend = Object.keys(log.pending||{}).length;
    var pct = items.length ? done/items.length : 0, C = 2*Math.PI*25;
    var html = renderKidSwitch() + renderProfile(p, true)+
      '<div class="card ring-row">'+
        '<svg class="ring" viewBox="0 0 62 62" aria-label="'+done+' of '+items.length+' quests done"><circle cx="31" cy="31" r="25" fill="none" stroke="#DCE9D6" stroke-width="7"/>'+
          '<circle cx="31" cy="31" r="25" fill="none" stroke="'+ACCENTS[p.accent]+'" stroke-width="7" stroke-linecap="round" stroke-dasharray="'+(C*pct).toFixed(1)+' '+C.toFixed(1)+'" transform="rotate(-90 31 31)"/>'+
          '<text x="31" y="36" text-anchor="middle" font-family="Baloo 2" font-size="15" fill="#1F2E23">'+done+'/'+items.length+'</text></svg>'+
        '<div><p class="quest-head">Today’s Quests</p><p class="quest-sub">'+(pend?pend+' waiting for a parent ⏳ · ':'')+'Tap a quest when you’ve done it — a parent approves it.</p></div>'+
      '</div>';
    SECTION_ORDER.forEach(function(key){
      var meta = SECTION_META[key];
      var list = items.filter(function(it){ return it.section===key; });
      if(!list.length) return;
      html += '<p class="section-title">'+meta.icon+' '+meta.title+'</p><div class="check-grid">'+
        list.map(function(it){
          var isDone = !!log.done[it.id], isPend = !isDone && !!log.pending[it.id];
          return '<button class="check-item '+(isDone?'done':isPend?'pending':'')+'" data-action="toggle-item" data-person="'+p.id+'" data-item="'+it.id+'">'+
            '<span class="check-icon">'+it.icon+'</span><span class="check-label">'+escapeHtml(it.label)+'</span>'+
            '<span class="check-pts">'+(isDone?'✓':isPend?'⏳':'+'+it.points)+'</span></button>';
        }).join('')+'</div>';
    });
    html += '<div style="height:12px;"></div>' + renderPerfectDayCard(p);
    return html;
  }

  /* ============ JOURNEY ============ */
  function renderJourney(p){
    var life = p.totalLifetime, li = landIndex(life), accent = ACCENTS[p.accent];
    var first = Math.max(0, li-2), last = li+3;
    var lands = []; for(var i=first;i<=last;i++) lands.push({idx:i, d:land(i)});
    var STEP = 104, W = 340, H = 90 + (lands.length-1)*STEP + 70;
    var pts = lands.map(function(_,j){ return {x: j%2===0 ? 92 : W-92, y: H-50-j*STEP}; });
    var d = 'M'+pts[0].x+' '+(pts[0].y+60)+' L'+pts[0].x+' '+pts[0].y;
    for(var j=1;j<pts.length;j++){ var a=pts[j-1], b=pts[j], my=(a.y+b.y)/2; d += ' C'+a.x+' '+my+' '+b.x+' '+my+' '+b.x+' '+b.y; }
    d += ' L'+pts[pts.length-1].x+' '+(pts[pts.length-1].y-70);
    function posFor(v){
      for(var j=0;j<lands.length-1;j++){
        if(v < lands[j+1].d.p){ var t=(v-lands[j].d.p)/(lands[j+1].d.p-lands[j].d.p); var a=pts[j], b=pts[j+1]; return {x:a.x+(b.x-a.x)*t, y:a.y+(b.y-a.y)*t}; }
      }
      return pts[pts.length-1];
    }
    var me = posFor(life);
    var labelsSvg = lands.map(function(L,j){
        var pt = pts[j], reached = life >= L.d.p;
        var left = pt.x < W/2, lx = left ? pt.x+36 : pt.x-36, anchor = left ? 'start' : 'end';
        var w = Math.max(L.d.n.length*7.4, 96) + 12, bx = left ? lx-6 : lx-w+6;
        return '<g>'+
          '<rect x="'+bx.toFixed(1)+'" y="'+(pt.y-38)+'" width="'+w.toFixed(1)+'" height="46" rx="10" fill="#FFFDF6" opacity="0.82"/>'+
          '<text x="'+lx+'" y="'+(pt.y-26)+'" text-anchor="'+anchor+'" font-family="Baloo 2" font-size="11" fill="'+(reached?accent:'#8A968D')+'">LEVEL '+(L.idx+1)+'</text>'+
          '<text x="'+lx+'" y="'+(pt.y-12)+'" text-anchor="'+anchor+'" font-family="Nunito" font-weight="800" font-size="12.5" fill="#1F2E23">'+escapeHtml(L.d.n)+'</text>'+
          '<text x="'+lx+'" y="'+(pt.y+3)+'" text-anchor="'+anchor+'" font-family="Baloo 2" font-size="11.5" fill="#5B6B60">'+(reached?'\u2713 reached':fmtNum(L.d.p)+' growth pts')+'</text>'+
        '</g>';
      }).join('');
    var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+escapeHtml(p.name)+'’s journey">'+
      '<defs><linearGradient id="jfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3EEDD" stop-opacity="1"/><stop offset="1" stop-color="#F3EEDD" stop-opacity="0"/></linearGradient></defs>'+
      '<g opacity="0.45" font-size="18">'+
        '<text x="14" y="'+(H-120)+'">🌴</text><text x="'+(W-34)+'" y="'+(H-210)+'">🌻</text><text x="'+(W/2-10)+'" y="'+(H-300)+'">🌿</text>'+
        '<text x="16" y="'+(H-400)+'">🌸</text><text x="'+(W-36)+'" y="'+(H-500)+'">🌴</text>'+
      '</g>'+
      '<path d="'+d+'" fill="none" stroke="#C9B48A" stroke-width="22" stroke-linecap="round"/>'+
      '<path d="'+d+'" fill="none" stroke="#FFF7E3" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round"/>'+
      '<rect x="0" y="0" width="'+W+'" height="70" fill="url(#jfade)"/>'+
      '<text x="'+(W/2)+'" y="22" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="12" fill="#5B6B60">↑ the journey keeps going…</text>'+
      lands.map(function(L,j){
        var pt = pts[j], reached = life >= L.d.p, here = L.idx===li;
        return '<g>'+
          (here ? '<circle cx="'+pt.x+'" cy="'+pt.y+'" r="33" fill="'+accent+'" opacity="0.22"/>' : '')+
          '<circle cx="'+pt.x+'" cy="'+pt.y+'" r="25" fill="'+(reached?'#fff':'#F2F2EC')+'" stroke="'+(reached?accent:'#B9C4BB')+'" stroke-width="3"/>'+
          '<text x="'+pt.x+'" y="'+(pt.y+8)+'" text-anchor="middle" font-size="23"'+(reached?'':' opacity="0.5"')+'>'+L.d.i+'</text>'+
        '</g>';
      }).join('')+
      kidsList().filter(function(o){ return o.id!==p.id && o.totalLifetime >= lands[0].d.p && o.totalLifetime < lands[lands.length-1].d.p; }).map(function(o){
        var q = posFor(o.totalLifetime), oc = ACCENTS[o.accent];
        return '<g opacity="0.6"><circle cx="'+(q.x+20)+'" cy="'+(q.y+14)+'" r="13" fill="#fff" stroke="'+oc+'" stroke-width="2"/>'+
          '<text x="'+(q.x+20)+'" y="'+(q.y+18.5)+'" text-anchor="middle" font-family="Baloo 2" font-size="11" fill="'+oc+'">'+escapeHtml(o.name.charAt(0))+'</text></g>';
      }).join('')+
      '<g transform="translate('+(me.x-24).toFixed(1)+' '+(me.y-24).toFixed(1)+')"><circle cx="24" cy="24" r="26" fill="'+accent+'"/>'+heroSVG(p,48).replace('<svg ','<svg x="0" y="0" ')+'</g>'+
      '<rect x="'+(me.x-38)+'" y="'+(me.y+28)+'" width="76" height="18" rx="9" fill="#1F2E23"/>'+
      '<text x="'+me.x+'" y="'+(me.y+41)+'" text-anchor="middle" font-family="Baloo 2" font-size="11" fill="#fff">'+fmtNum(life)+' growth</text>'+
    labelsSvg + '</svg>';
    var N = land(li+1);
    var badges = []; for(var b=0;b<=li+2;b++) badges.push({d:land(b), got:b<=li});
    var chips = SECTION_ORDER.concat(['bonus']).map(function(c){
      var meta = SECTION_META[c];
      return '<div class="chip">'+meta.icon+' '+meta.title+' <b>'+(p.lifetime[c]||0)+'</b></div>';
    }).join('');
    return renderKidSwitch() + renderProfile(p, false)+
      '<div class="trail-wrap">'+
        '<div class="trail-banner"><b>'+fmtNum(N.p-life)+' growth pts</b> to reach '+N.i+' <b>'+N.n+'</b><br>Spending points in the Shop never moves you back 🌱</div>'+
        svg+
      '</div>'+
      '<p class="section-title">Land badges</p>'+
      '<div class="badges">'+badges.map(function(u){ return '<div class="badge '+(u.got?'':'locked')+'"><div class="bi">'+u.d.i+'</div>'+u.d.n+'</div>'; }).join('')+'</div>'+
      '<p class="section-title">Growth by type</p><div class="chip-row" style="justify-content:flex-start;">'+chips+'</div>'+
      '<div class="note-box" style="margin-top:14px;">💡 Your <b>journey</b> is every point you’ve ever earned, so it only goes forward, even after the top reward. Your <b>points</b> are what you can spend in the Shop.</div>';
  }

  /* ============ SHOP ============ */
  function renderShop(p){
    var cur = state.data.currency, rewards = state.data.rewards, top = topReward(), g = goalFor(p);
    var spend = spendablePoints(p);
    var html = renderKidSwitch()+
      '<div class="money-card" style="margin-bottom:8px;">'+
        '<div class="money-stat"><span class="money-label">⭐ Points</span><span class="money-val disp" style="color:var(--berry);">'+fmtNum(p.points)+'</span></div>'+
        '<div class="money-stat"><span class="money-label">💰 Money</span><span class="money-val disp" style="color:var(--teal);">'+escapeHtml(cur)+' '+fmtMoney(p.savings)+'</span></div>'+
      '</div>'+
      '<button class="btn-secondary" style="width:100%;" data-action="open-convert" data-person="'+p.id+'">🔄 Ask to convert points to money ('+ptsLabel(state.data.pointsPerCurrency)+' = '+escapeHtml(cur)+' 1)</button>'+
      convertRequestNote(p);
    if(g){
      var pct = Math.min(100, Math.round(spend/g.cost*100)), ready = spend >= g.cost;
      html += '<div class="card goal-card" style="margin-top:12px;--accent:'+ACCENTS[p.accent]+'">'+
        '<div class="goal"><span class="gi">'+(REWARD_CATS[g.category]||REWARD_CATS.custom).icon+'</span><div class="gt">'+
          '<p class="gn">Saving for: '+escapeHtml(g.label)+(top && g.id===top.id?' <span class="new" style="background:var(--sun)">TOP REWARD</span>':'')+'</p>'+
          '<p class="gs">'+fmtNum(spend)+' / '+fmtNum(g.cost)+' pts'+(ready?' — ready to redeem! 🎉':' — '+fmtNum(g.cost-spend)+' to go')+'</p>'+
          '<div class="bar"><i style="width:'+pct+'%;background:'+ACCENTS[p.accent]+'"></i></div></div></div>'+
        '<p class="eyebrow" style="margin-top:8px;">Change my goal:</p>'+
        '<div class="goal-pick">'+rewards.slice().sort(function(a,b){ return a.cost-b.cost; }).map(function(r){
          return '<button class="gp '+(r.id===g.id?'active':'')+'" data-action="set-goal" data-person="'+p.id+'" data-reward="'+r.id+'">'+escapeHtml(r.label)+'</button>';
        }).join('')+'</div>'+
      '</div>';
    }
    if(!rewards.length){
      html += '<div class="empty-state"><span class="em">🎁</span>No rewards yet.<br>Ask a parent to add some in Parent Mode!</div>';
    }
    REWARD_CAT_ORDER.forEach(function(c){
      var list = rewards.filter(function(r){ return r.category===c; }).sort(function(a,b){ return a.cost-b.cost; });
      if(!list.length) return;
      html += '<p class="section-title">'+REWARD_CATS[c].icon+' '+REWARD_CATS[c].label+'</p><div class="reward-grid">'+
        list.map(function(r){
          var cash = cashPriceFor(r), canPts = spend >= r.cost, canCash = p.savings >= cash, isTop = top && r.id===top.id;
          var need = (!canPts && !canCash) ? '<span class="reward-need">Need '+fmtNum(r.cost-spend)+' more pts</span>' : '';
          return '<div class="reward-card'+(isTop?' top':'')+'">'+(isTop?'<span class="top-tag">TOP</span>':'')+
            '<div class="reward-icon">'+REWARD_CATS[r.category].icon+'</div>'+
            '<div class="reward-label">'+escapeHtml(r.label)+'</div>'+
            '<div class="reward-cost disp">'+fmtNum(r.cost)+' pts <span style="color:var(--ink-soft);font-size:13px;">or</span> '+escapeHtml(cur)+' '+fmtMoney(cash)+'</div>'+
            '<div class="reward-pay-row">'+
              '<button class="reward-btn" data-action="ask-redeem" data-pay="points" data-person="'+p.id+'" data-reward="'+r.id+'"'+(canPts?'':' disabled')+'>⭐ Points</button>'+
              '<button class="reward-btn cash" data-action="ask-redeem" data-pay="cash" data-person="'+p.id+'" data-reward="'+r.id+'"'+(canCash?'':' disabled')+'>💰 Money</button>'+
            '</div>'+need+
          '</div>';
        }).join('')+'</div>';
    });
    var open = !!state.ui.showHistory;
    html += '<button class="btn-secondary" style="width:100%;margin-top:16px;" data-action="toggle-history">'+(open?'▲ Hide':'📜 Show')+' my history</button>';
    if(open) html += '<div style="margin-top:10px;">'+renderActivityTab(p)+'</div>';
    html += '<div class="note-box" style="margin-top:14px;">Got money for Eid, a gift or charity? Ask a parent to add it in Parent Mode → Adjust.</div>';
    return html;
  }

  /* ============ parents' own checklist (no points) ============ */
  function renderParentPerson(){
    var p = getPerson(state.route.personId);
    if(!p){ state.route = {name:'home'}; return renderHome(); }
    if(p.role==='kid'){ state.ui.kidId = p.id; state.route = {name:'quests'}; return '<div class="screen">'+renderQuests(p)+'</div>'; }
    var tab = state.route.tab || 'today';
    var content;
    if(tab==='money') content = renderMoneyTab(p);
    else if(tab==='activity') content = renderActivityTab(p);
    else {
      var log = todayLogFor(p), items = visibleItemsFor(p);
      content = '<div class="note-box">Your own checklist — just for your accountability. No points or rewards for parents.</div>';
      SECTION_ORDER.forEach(function(key){
        var meta = SECTION_META[key];
        var list = items.filter(function(it){ return it.section===key; });
        if(!list.length) return;
        content += '<p class="section-title">'+meta.icon+' '+meta.title+'</p><div class="check-grid">'+
          list.map(function(it){
            var d = !!log.done[it.id];
            return '<button class="check-item '+(d?'done':'')+'" data-action="toggle-item" data-person="'+p.id+'" data-item="'+it.id+'">'+
              '<span class="check-icon">'+it.icon+'</span><span class="check-label">'+escapeHtml(it.label)+'</span>'+
              '<span class="check-pts">'+(d?'✓':'')+'</span></button>';
          }).join('')+'</div>';
      });
    }
    return '<div class="screen" style="--accent:'+ACCENTS[p.accent]+'">'+
      '<div class="kid-topbar">'+
        '<button class="btn-icon" data-action="go-home" aria-label="Back">←</button>'+
        '<div class="kid-topbar-name"><span class="kid-avatar-sm">'+p.avatar+'</span><h2 class="disp">'+escapeHtml(p.name)+'</h2></div>'+
      '</div>'+
      '<div class="tabs">'+
        ['today','money','activity'].map(function(t){
          return '<button class="tab '+(tab===t?'active':'')+'" data-action="person-tab" data-person="'+p.id+'" data-tab="'+t+'">'+(t==='today'?'Checklist':t==='money'?'Money':'Activity')+'</button>';
        }).join('')+
      '</div>'+ content + '</div>';
  }

  /* ============ bottom tab bar ============ */
  function renderTabbar(active){
    var pending = countAllPending();
    var k = currentKid();
    var TABS = [
      {id:'home',    ic:'🏠', l:'Home'},
      {id:'quests',  ic:'✅',       l:'Quests'},
      {id:'journey', ic:'🗺️', l:'Journey'},
      {id:'shop',    ic:'🎁', l:'Shop'},
      {id:'parent',  ic:'🔒', l:'Parent', badge:pending}
    ];
    return '<nav class="tabbar" style="--accent:'+(k && active!=='home' && active!=='parent' ? ACCENTS[k.accent] : 'var(--moss)')+'">'+TABS.map(function(t){
      return '<button class="tabbtn '+(active===t.id?'active':'')+'" data-action="nav" data-tab="'+t.id+'"><span class="ic">'+t.ic+'</span>'+t.l+(t.badge?'<span class="dot">'+t.badge+'</span>':'')+'</button>';
    }).join('')+'</nav>';
  }

  /* ============ parents' money + everyone's activity ============ */
  function renderMoneyTab(p){
    var cur = state.data.currency;
    var MONEY_KINDS = ['savings','charity_money','convert','redeem_cash'];
    var entries = state.data.history.filter(function(h){ return h.personId===p.id && MONEY_KINDS.indexOf(h.kind)!==-1; });
    var list = entries.length ? '<div class="activity-list">'+ entries.map(function(h){
      var icon = h.kind==='savings' ? '\uD83D\uDCB0' : h.kind==='convert' ? '\uD83D\uDD04' : h.kind==='redeem_cash' ? '\uD83C\uDF81' : '\uD83E\uDD32';
      var neg = h.kind==='redeem_cash';
      return '<div class="activity-row"><div class="activity-icon">'+icon+'</div>'+
        '<div class="activity-body"><div class="activity-label">'+escapeHtml(h.label||(h.kind==='savings'?'Savings added':'Charity given'))+'</div>'+
        '<div class="activity-meta">'+timeAgo(h.ts)+'</div></div>'+
        '<div class="activity-pts '+(neg?'neg':'pos')+'">'+(neg?'-':'+')+cur+' '+fmtMoney(h.amount)+'</div></div>';
    }).join('') + '</div>' : '<div class="empty-state"><span class="em">\uD83D\uDCB0</span>No money logged yet.</div>';
    var isKid = p.role==='kid';
    var convertBtn = isKid
      ? '<button class="btn-secondary" style="width:100%;margin-bottom:6px;" data-action="open-convert" data-person="'+p.id+'">\uD83D\uDD04 Ask to convert points to money ('+ptsLabel(state.data.pointsPerCurrency)+' = '+cur+' 1)</button>'+
        convertRequestNote(p)+'<div style="height:8px;"></div>'
      : '';
    // Kids can't add money themselves (money buys rewards) \u2014 parents add it
    // from Parent Mode > Adjust. Parents can still log their own here.
    var addBtns = isKid
      ? '<div class="note-box" style="margin-top:14px;">Got money for Eid, a gift or charity? Ask a parent to add it in Parent Mode \u2192 Adjust.</div>'
      : '<div class="seg-row" style="margin-top:14px;">'+
          '<button class="btn-secondary" style="flex:1;" data-action="open-money-form" data-person="'+p.id+'" data-kind="savings">+ Add Savings</button>'+
          '<button class="btn-secondary" style="flex:1;" data-action="open-money-form" data-person="'+p.id+'" data-kind="charity_money">+ Add Charity</button>'+
        '</div>';
    return convertBtn + '<div class="money-card">'+
        '<div class="money-stat"><span class="money-label">'+(isKid?'Money':'Savings')+'</span><span class="money-val disp">'+cur+' '+fmtMoney(p.savings)+'</span></div>'+
        '<div class="money-stat"><span class="money-label">Charity Given</span><span class="money-val disp" style="color:var(--berry);">'+cur+' '+fmtMoney(p.charityGiven)+'</span></div>'+
      '</div>'+
      addBtns+
      '<p class="section-title">History</p>' + list;
  }

  function renderActivityTab(p){
    var items = state.data.history.filter(function(h){ return h.personId === p.id; });
    if(items.length===0){
      return '<div class="empty-state"><span class="em">\uD83C\uDF31</span>No activity yet \u2014 it will show up here!</div>';
    }
    var cur = state.data.currency;
    return '<div class="activity-list">'+ items.map(function(h){
      var icon, main, cls;
      if(h.kind==='redeem'){ icon=(REWARD_CATS[h.category]||REWARD_CATS.custom).icon; main='-'+h.points; cls='neg'; }
      else if(h.kind==='redeem_cash'){ icon=(REWARD_CATS[h.category]||REWARD_CATS.custom).icon; main='-'+cur+' '+fmtMoney(h.amount); cls='neg'; }
      else if(h.kind==='convert'){ icon='🔄'; main='-'+h.points+' → +'+cur+' '+fmtMoney(h.amount); cls='pos'; }
      else if(h.kind==='savings' || h.kind==='charity_money'){ icon = h.kind==='savings' ? '\uD83D\uDCB0' : '\uD83E\uDD32'; main='+'+cur+' '+fmtMoney(h.amount); cls='pos'; }
      else{
        var meta = SECTION_META[h.category] || SECTION_META.bonus;
        icon = meta.icon;
        if(!h.points){ main = '\u2713'; cls = 'pos'; }
        else{ var neg = h.points < 0; main = (neg?'':'+') + h.points; cls = neg ? 'neg' : 'pos'; }
      }
      return '<div class="activity-row"><div class="activity-icon">'+icon+'</div>'+
        '<div class="activity-body"><div class="activity-label">'+escapeHtml(h.label)+'</div>'+
        '<div class="activity-meta">'+timeAgo(h.ts)+'</div></div>'+
        '<div class="activity-pts '+cls+'">'+main+'</div></div>';
    }).join('') + '</div>';
  }

  /* ============ parent lock ============ */
  function renderParentLock(){
    var entered = state.ui.pinEntry || '';

          '<button class="pin-key" data-action="pin-back">\u232B</button>'+

        '<p class="lock-hint">Default PIN is 1234 \u2014 change it under Settings once inside.</p>'+

  /* ============ parent dashboard ============ */
  function countAllPending(){
    var n = 0;
    state.data.people.forEach(function(p){
      n += Object.keys(todayLogFor(p).pending||{}).length;
      n += (p.convertRequests||[]).length;
    });
    n += state.data.owed.length;
    return n;
  }
  function renderParent(){
    var tab = state.route.tab || 'approvals';
    var content = tab==='approvals' ? renderParentApprovals()
      : tab==='members' ? renderParentMembers()
      : tab==='items' ? renderParentItems()
      : tab==='rewards' ? renderParentRewards()
      : tab==='adjust' ? renderParentAdjust()
      : renderParentSettings();
    var pendingCount = countAllPending();
    return '<div class="screen parent-screen">'+
      '<div class="parent-topbar"><h2 class="disp">\uD83D\uDCD3 Parent Mode</h2><button class="btn-ghost" data-action="exit-parent">Exit</button></div>'+
      '<div class="parent-tabs">'+
        '<button class="ptab '+(tab==='approvals'?'active':'')+'" data-action="parent-tab" data-tab="approvals">Approvals'+(pendingCount?' ('+pendingCount+')':'')+'</button>'+
        '<button class="ptab '+(tab==='members'?'active':'')+'" data-action="parent-tab" data-tab="members">Members</button>'+
        '<button class="ptab '+(tab==='items'?'active':'')+'" data-action="parent-tab" data-tab="items">Daily Items</button>'+
        '<button class="ptab '+(tab==='rewards'?'active':'')+'" data-action="parent-tab" data-tab="rewards">Rewards</button>'+
        '<button class="ptab '+(tab==='adjust'?'active':'')+'" data-action="parent-tab" data-tab="adjust">Adjust</button>'+
        '<button class="ptab '+(tab==='settings'?'active':'')+'" data-action="parent-tab" data-tab="settings">Settings</button>'+
      '</div>'+ content + '</div>';
  }

  function renderParentApprovals(){
    var rows = [];
    state.data.people.forEach(function(p){
      var log = todayLogFor(p);
      Object.keys(log.pending||{}).forEach(function(itemId){
        var item = getItem(itemId);
        if(!item) return;
        rows.push({p:p, item:item});
      });
    });
    var cur = state.data.currency;
    var extra = '';

    // points -> money requests
    var convRows = [];
    state.data.people.forEach(function(p){ (p.convertRequests||[]).forEach(function(rq){ convRows.push({p:p, rq:rq}); }); });
    if(convRows.length){
      extra += '<div class="card"><p class="field-label">\ud83d\udd04 Points \u2192 money requests</p>'+ convRows.map(function(c){
        return '<div class="list-row"><div style="font-size:19px;">'+c.p.avatar+'</div>'+
          '<div class="grow"><div class="name">'+escapeHtml(c.p.name)+'</div>'+
          '<div class="sub">'+c.rq.pts+' pts \u2192 '+cur+' '+fmtMoney(pointsToCash(c.rq.pts))+' \u00b7 '+timeAgo(c.rq.ts)+'</div></div>'+
          '<button class="icon-btn" style="color:var(--moss);" data-action="approve-convert" data-person="'+c.p.id+'" data-req="'+c.rq.id+'">\u2713</button>'+
          '<button class="icon-btn" style="color:var(--coral);" data-action="decline-convert" data-person="'+c.p.id+'" data-req="'+c.rq.id+'">\u2715</button></div>';
      }).join('') + '</div>';
    }

    // rewards kids redeemed that still need handing over
    if(state.data.owed.length){
      extra += '<div class="card"><p class="field-label">\ud83c\udf81 Rewards to hand over</p>'+ state.data.owed.map(function(o){
        var p = getPerson(o.personId);
        return '<div class="list-row"><div style="font-size:19px;">'+(p?p.avatar:'\ud83c\udf81')+'</div>'+
          '<div class="grow"><div class="name">'+escapeHtml(o.label)+'</div>'+
          '<div class="sub">'+(p?escapeHtml(p.name):'Removed member')+' \u00b7 '+escapeHtml(o.paid)+' \u00b7 '+timeAgo(o.ts)+'</div></div>'+
          '<button class="btn-secondary" style="padding:7px 10px;font-size:12.5px;" data-action="mark-given" data-owed="'+o.id+'">\u2713 Given</button></div>';
      }).join('') + '</div>';
    }

    // today's approved tasks, with undo
    var doneRows = [];
    state.data.people.forEach(function(p){
      if(p.role!=='kid') return;
      var log = todayLogFor(p);
      Object.keys(log.done||{}).forEach(function(itemId){ var it = getItem(itemId); if(it) doneRows.push({p:p, item:it}); });
    });
    var undoHtml = '';
    if(doneRows.length){
      var open = !!state.ui.showApproved;
      undoHtml = '<div class="card"><button class="btn-secondary" style="width:100%;" data-action="toggle-approved">'+
          (open?'\u25b2 Hide':'\u25bc Show')+' today\u2019s approved tasks ('+doneRows.length+') \u2014 undo a mistake</button>'+
        (open ? doneRows.map(function(r){
          return '<div class="list-row"><div style="font-size:19px;">'+r.item.icon+'</div>'+
            '<div class="grow"><div class="name">'+escapeHtml(r.p.name)+' '+r.p.avatar+'</div>'+
            '<div class="sub">'+escapeHtml(r.item.label)+' \u00b7 +'+r.item.points+' pts</div></div>'+
            '<button class="btn-secondary" style="padding:7px 10px;font-size:12.5px;color:var(--coral);" data-action="undo-item" data-person="'+r.p.id+'" data-item="'+r.item.id+'">\u21a9 Undo</button></div>';
        }).join('') : '')+
      '</div>';
    }

    if(!rows.length){
      return (extra || '<div class="empty-state"><span class="em">\u2705</span>All caught up \u2014 no approvals waiting.</div>') + undoHtml;
    }
    var listHtml = rows.map(function(r){
      return '<div class="list-row">'+
        '<div style="font-size:19px;">'+r.item.icon+'</div>'+
        '<div class="grow"><div class="name">'+escapeHtml(r.p.name)+' '+r.p.avatar+'</div>'+
        '<div class="sub">'+escapeHtml(r.item.label)+' \u00B7 +'+r.item.points+' pts</div></div>'+
        '<button class="icon-btn" style="color:var(--moss);" data-action="approve-item" data-person="'+r.p.id+'" data-item="'+r.item.id+'">\u2713</button>'+
        '<button class="icon-btn" style="color:var(--coral);" data-action="decline-item" data-person="'+r.p.id+'" data-item="'+r.item.id+'">\u2715</button>'+
      '</div>';
    }).join('');
    return '<div class="card"><p class="field-label">Waiting for approval</p>'+listHtml+'</div>'+
      '<button class="btn-primary" data-action="approve-all" style="margin-bottom:14px;">Approve all tasks ('+rows.length+')</button>'+
      extra + undoHtml;
  }

      var isSave = m.kind==='savings';
      return '<div class="modal-overlay" data-action="close-modal"><div class="modal-card" data-action="stop">'+
        '<h3 class="disp">'+(isSave?'Add Savings':'Add Charity')+'</h3>'+

        '<button class="btn-primary" data-action="submit-money" data-person="'+person.id+'" data-kind="'+m.kind+'">Add</button></div>'+
      '</div></div>';

    if(m.type==='convert'){
      var kid = getPerson(m.personId);
